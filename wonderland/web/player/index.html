<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonderland — Relay</title>
<link rel="stylesheet" href="./player.css">

<!--
  WONDERLAND IS AN AI CREATION PLATFORM WRAPPED IN AN OPEN-WORLD INTERFACE.
  The world is the streamed Unreal frame; the terminal over it is where work is
  actually commissioned. Space opens it, Escape returns to the world, and the
  Relay Dog does not jump.

  THE TERMINAL'S MARKUP IS NOT HERE. It lives in mount.js, once, because the
  same panel also has to be built onto Epic's Pixel Streaming frontend at run
  time -- that page is a stock player.html plus a 2.5 MB bundle and has no
  markup to author into. Two copies of an approved design is two designs, and
  the second one drifts.

  This page is the standalone harness: a <video> the capture script fills, and
  the same mount.
-->

<div id="wl-world" tabindex="0" aria-label="Wonderland world view">
  <video id="wl-video" playsinline autoplay muted></video>
</div>

<script type="module">
  import { mount } from './mount.js';
  mount({ cssHref: null, worldSelector: '#wl-world' });
</script>
