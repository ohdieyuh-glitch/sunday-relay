; WONDERLAND — engine configuration.
;
; Authored on a machine that cannot RUN Unreal (Chromebook, no GPU, 2.7 GiB in
; the container), which is exactly why it exists: everything that can be decided
; without executing UE is decided here, so the first session on real hardware
; starts at "generate project files and build" rather than at configuration.

[/Script/EngineSettings.GameMapsSettings]
; THE EDITOR OPENS THE RECOVERED WONDERLAND V2 WORLD (2026-09-12).
; /Game/WonderlandV2/Maps/WL_V2_GoldenArrival_WP2 is the canonical development
; world, restored byte-for-byte from the Lightning Studio. Its near-namesake
; WL_V2_GoldenArrival is the EMPTY World Partition container: never develop in it.
;
; GameDefaultMap still names the local bootstrap hub. Which map a packaged build
; boots is a product decision this recovery did not make, so the two entry
; points now deliberately differ.
;
; The hub game mode is safe in the V2 world, and that was measured rather than
; assumed: BP_RelayDog auto-possesses Player 0 inside InitInputSystem, before
; PostLogin, so RestartPlayer finds a pawn and never spawns the hub's default
; AWonderlandDogPawn (UE 5.8.2 PIE: one RelayDogCharacter, zero WonderlandDogPawn).
EditorStartupMap=/Game/WonderlandV2/Maps/WL_V2_GoldenArrival_WP2.WL_V2_GoldenArrival_WP2
GameDefaultMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
GlobalDefaultGameMode=/Script/Wonderland.WonderlandHubGameMode

[/Script/Engine.RendererSettings]
; Premium crisp glossy HD is the founder's bar. Lumen GI + reflections and
; virtual shadow maps are the UE5 defaults that deliver it; stated explicitly so
; a machine with older project templates cannot silently downgrade them.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AntiAliasingMethod=4
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=True
; CACHED LIGHTING PRE-EXPOSURE MATCHES THE WORLD'S PINNED EXPOSURE.
; WL_V2_GoldenArrival_WP2's unbound PostProcessVolume pins EV100 at exactly
; 13.5 (min = max = 13.5, histogram). With the engine default here, Lumen's
; cached lighting and the real-time sky capture were pre-exposed for a
; different range and UE 5.8 warned that they were being clipped. The Studio's
; V2 config carried this value for the same reason (PASS 01, 2026-08-28); the
; Windows setup dropped it.
r.EyeAdaptation.CachedLightingPreExposure=13.5

[/Script/Engine.Engine]
; Fixed-timestep OFF; the Dog breathes on real elapsed seconds
; (wonderlandBreathAt takes ONE parameter and holds no state).
bUseFixedFrameRate=False

[/Script/Engine.CollisionProfile]
; The pawn's mesh uses the Pawn profile; declared rather than assumed so the
; C++ SetCollisionProfileName("Pawn") call resolves on a clean project.

