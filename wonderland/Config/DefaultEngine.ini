; Wonderland — packaged runtime configuration.
;
; THIS FILE DID NOT EXIST, AND THAT IS WHY THE LIVE STREAM SHOWED THE WRONG
; WORLD. The generator saves the built world to
; /Game/Wonderland/Maps/WonderlandHub, but nothing told the packaged build to
; open it: with no GameDefaultMap, a packaged Unreal game boots the engine's own
; default map. So the stream was working perfectly and showing a near-empty
; template with whatever the default GameMode spawned — a simple blocky scene
; with proxy-looking pawns and none of the generated world.
;
; It is also why build-wonderland.sh lists Config/ as an OPTIONAL input: the
; directory was genuinely absent. That made the earlier hash crash reproducible,
; and it should have been read as evidence that a required piece was missing
; rather than only as a bash bug.

[/Script/EngineSettings.GameMapsSettings]
; WONDERLAND V2 (relay/wonderland-v2): the default map is the NEW V2 level.
; V1's map still exists at /Game/Wonderland/Maps/WonderlandHub and is untouched;
; it is simply not what this branch opens. V1 branches keep their own ini.
GameDefaultMap=/Game/WonderlandV2/Maps/WL_V2_GoldenArrival.WL_V2_GoldenArrival
EditorStartupMap=/Game/WonderlandV2/Maps/WL_V2_GoldenArrival.WL_V2_GoldenArrival
ServerDefaultMap=/Game/WonderlandV2/Maps/WL_V2_GoldenArrival.WL_V2_GoldenArrival
; A GlobalDefaultGameMode IS SET NOW, and the note that used to sit here was
; right about the reason and wrong about the conclusion. It said: this project
; has no AGameModeBase subclass, so naming one would be a fabricated setting
; that resolves to nothing. True. What it missed is what the ABSENCE resolves
; to: stock APlayerController. AWonderlandPlayerController::BeginPlay was
; therefore never called, `-CinematicView` and `-HeroCam=N` were never read, and
; every hero capture this project has ever taken was the same view no matter
; which camera was asked for. Proven on the L4 2026-08-22: HeroCam0, HeroCam3
; (1,300 uu away) and HeroCam6 returned three frames of identical composition.
;
; The repair is to make a GameMode EXIST, not to name a fiction. It sets
; PlayerControllerClass and nothing else — which pawn the player possesses stays
; a gameplay decision and is untouched, so the default streamed view is
; unchanged and only the cinematic path starts working.
GlobalDefaultGameMode=/Script/Wonderland.WonderlandGameMode

; THE PACKAGING SETTINGS MOVED TO DefaultGame.ini AND THAT IS THE WHOLE BUG.
; UnrealEd.ProjectPackagingSettings is a Game-ini config class. Declared here it
; is silently ignored, so +DirectoriesToAlwaysCook never applied and every
; material reached only by a runtime LoadObject path was stripped from the pak.
; The live L4 render came up with all 146 instanced batches grey — "material
; did not load" 146 times — and the world looked like an untextured graybox.
; It survived before batching only because each StaticMeshActor held a HARD
; reference to its material, which the cooker follows.

[/Script/Engine.RendererSettings]
; PixelStreaming2 encodes what the renderer produces; nothing here changes the
; art. These are the two settings a packaged offscreen stream actually needs.
r.CustomDepth=3

; ---------------------------------------------------------------------------
; SHADER MODEL 5, BY MEASUREMENT. SM6 COSTS HALF THE FRAME RATE HERE.
;
; SM6 was added so Nanite could run -- Nanite is inert without it and silently
; renders its fallback mesh at full triangle count. Both were then measured
; through the real stream, and the second measurement corrected the first:
;
;     SM5, no Nanite     14, 15, 10 fps    VRAM 1,603 MiB    GPU 99%
;     SM6, Nanite ON      5,  7,  8 fps    VRAM 2,673 MiB    GPU 42%
;     SM6, Nanite OFF     7,  8,  7 fps    VRAM 2,794 MiB    GPU 64%
;
; The third row is the one that matters and it was nearly not taken. With
; Nanite disabled and SM6 still active the frame rate stayed halved, so the
; cost is SM6 ITSELF on this Vulkan/L4 target, not Nanite -- Nanite added
; little on top of it. An earlier commit blamed Nanite alone; that was wrong,
; and it was wrong because the two changes had been made together and only
; separated afterwards.
;
; SM6 turns on heavier infrastructure whether or not anything uses it, which
; the VRAM tells as clearly as the frame rate: 1.6 GB -> 2.8 GB with the world
; unchanged and the frame visually identical.
;
; So this targets SM5 only. Re-add SF_VULKAN_SM6 to try Nanite again, and
; expect to pay the frame rate above for it.
; WONDERLAND V2 TAKES SM6 ON PURPOSE. The measurement above is real and it is
; V1's: SM6 cost half the frame rate for a frame that could not use Nanite or
; Lumen because its world was twelve-triangle primitives. V2's assets are
; Geometry Script subdivision meshes with Nanite, lit by Lumen, and the
; founder's order is quality first, then optimise. measure-fps.sh reports the
; price. Put SF_VULKAN_SM5 back to compare.
; 2026-08-26, MEASURED ON THE L4: the SM6 package rendered ALL-ZERO frames from
; every camera through BOTH capture paths (HighResShot and the Pixel-Streaming
; capture in real Chrome), with post-processing off, with Lumen/VSM off, and
; in "viewmode unlit" -- nothing reaches the frame under VULKAN_SM6 (bindless,
; VK_EXT_descriptor_buffer) on this driver. SM5 rendered structured frames on
; this same box on 2026-08-22. V2 therefore ships SM5 until SM6 is understood;
; Nanite falls back to the full meshes and VSM to shadow maps automatically,
; Lumen's software GI still runs. Put SF_VULKAN_SM6 back to retest.
[/Script/LinuxTargetPlatform.LinuxTargetSettings]
+TargetedRHIs=SF_VULKAN_SM5

; ---------------------------------------------------------------------------
; SHARPNESS, MEASURED RATHER THAN CHOSEN
;
; The goal asks for a sharper presentation and the honest starting position was
; that nothing in this work had sharpened anything: acutance 14.279 -> 13.627
; across the whole colour fix, i.e. unchanged.
;
; Swept on the real build, five levers, one frame each, acutance measured on
; the delivered image:
;
;     r.Tonemapper.Sharpen 0      13.665      (base)
;     r.Tonemapper.Sharpen 0.5    14.064      +2.9%
;     r.Tonemapper.Sharpen 1.0    14.515      +6.2%
;     r.ScreenPercentage 125      14.127      +3.4%
;     r.MipMapLODBias -1          13.682      +0.1%
;
; Sharpen 1.0 is taken and ScreenPercentage is NOT: 125% costs 56% more pixels
; for half the gain, and this world is already short of its frame-rate target.
; MipMapLODBias does essentially nothing here, which is itself informative --
; the softness is not texture mip selection, so the usual "sharpen the
; textures" reflex would have been wasted work.
;
; A post-process sharpen is a real lever and a modest one. It does not turn
; low-poly primitives into detail; it recovers acutance that TSR's temporal
; history takes off a static camera.
[/Script/Engine.RendererSettings]
r.Tonemapper.Sharpen=1.0

; ---------------------------------------------------------------------------
; WONDERLAND V2 RENDERING FOUNDATION (relay/wonderland-v2)
; Lumen GI + reflections, virtual shadow maps, Nanite, mesh distance fields,
; and the sky/fog support V2's atmosphere depends on. Stated explicitly rather
; than inherited, so a reader of this file knows what the V2 frame is made of.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=False
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricFog=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False
