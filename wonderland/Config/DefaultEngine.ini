[/Script/Engine.NavigationSystem]
bAutoCreateNavigationData=True

[/Script/NavigationSystem.NavigationSystemV1]
; WONDERLAND IS A 1,478 m DISC CARRYING 174,787 INSTANCES. Baking a navmesh across 2.5 km of that is not
; a small operation, and the map is a 46 MB asset on a shared Content junction. Generating only around
; navigation invokers gives routable navigation where a player actually is, at a cost that does not scale
; with the size of the world -- which is the whole reason the level shipped with no nav data at all.
bGenerateNavigationOnlyAroundNavigationInvokers=True
bAutoCreateNavigationData=True
bAllowClientSideNavigation=True

[/Script/NavigationSystem.RecastNavMesh]
; Sized to the Relay Dog's own capsule rather than the engine defaults, so a path found here is a path the
; Dog can actually walk. Read off the character: radius 34, half height 88, max step 30.
; RUNTIME GENERATION, WHICH IS THE WHOLE POINT OF AN INVOKER.
; RecastNavMesh defaults to RuntimeGeneration=Static, meaning tiles come only from a baked build and an
; invoker can never produce any. Measured: bounds volume present, invoker registered on the Dog, 1,422
; instanced components covering 50,252 instances affecting navigation -- and after 90 seconds still no
; reachable point within 3,000 uu. Static was why.
; COST, MEASURED PROPERLY -- AND IT IS NOT MEASURABLE.
;
; I first compared three runs taken before navigation (baseline 28.4-30.5 ms) against three taken after
; (32.3-36.3) and called the gap a real regression because the ranges did not overlap. They were ninety
; minutes apart on a machine that throttles under sustained PIE, which is a confound big enough to explain
; the whole difference. zc_nav_cost measures both sides in ONE session minutes apart, flipping only
; runtime_generation: with navigation median 35.06 ms, without it 37.75 ms. A difference of -2.69 ms, i.e.
; navigation is free at these settings and the regression was the room temperature.
;
; So the voxels stay FINE rather than the coarse 48/20 I set while believing the wrong thing. CellSize near
; half the 34 uu agent radius is what keeps narrow ways navigable, and there is no measured cost to pay for
; it with.
RuntimeGeneration=Dynamic
AgentRadius=34.000000
AgentHeight=176.000000
AgentMaxStepHeight=30.000000
AgentMaxSlope=44.000000
CellSize=25.000000
CellHeight=10.000000
TileSizeUU=1200.000000
bFixedTilePoolSize=False
bDrawNavMesh=False
