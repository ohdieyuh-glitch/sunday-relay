; Wonderland — packaged runtime configuration.
;
; THIS FILE DID NOT EXIST, AND THAT IS WHY THE LIVE STREAM SHOWED THE WRONG
; WORLD. The generator saves the built world to
; /Game/Wonderland/Maps/WonderlandHub, but nothing told the packaged build to
; open it: with no GameDefaultMap, a packaged Unreal game boots the engine's own
; default map. So the stream was working perfectly and showing a near-empty
; template with whatever the default GameMode spawned — a simple blocky scene
; with proxy-looking pawns and none of the generated world.
;
; It is also why build-wonderland.sh lists Config/ as an OPTIONAL input: the
; directory was genuinely absent. That made the earlier hash crash reproducible,
; and it should have been read as evidence that a required piece was missing
; rather than only as a bash bug.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
EditorStartupMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
ServerDefaultMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
; NO GlobalDefaultGameMode IS SET, deliberately. This project has no GameMode
; class (Source/Wonderland has a PlayerController and a DogPawn and no
; AGameModeBase subclass), and naming one that does not exist would be a
; fabricated setting that the engine resolves to nothing. The Relay Dogs are
; placed into the level BY THE GENERATOR, not spawned by a GameMode, so pinning
; the map is the whole fix; inventing a GameMode here would be a gameplay
; change, which this task explicitly excludes.

[/Script/UnrealEd.ProjectPackagingSettings]
; COOK THE MAP EXPLICITLY. BuildCookRun with no map list cooks what it can infer
; from the maps settings; stating it means a cook that omitted WonderlandHub is
; a build failure rather than a discovery made from a browser.
+MapsToCook=(FilePath="/Game/Wonderland/Maps/WonderlandHub")
; The generated world imports its textures, audio, materials and VFX under
; /Game/Wonderland/**. Referenced assets are cooked automatically, but the
; directory is named so an asset reached only at runtime is not dropped.
+DirectoriesToAlwaysCook=(Path="/Game/Wonderland")

[/Script/Engine.RendererSettings]
; PixelStreaming2 encodes what the renderer produces; nothing here changes the
; art. These are the two settings a packaged offscreen stream actually needs.
r.CustomDepth=3
