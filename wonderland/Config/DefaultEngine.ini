; Wonderland — packaged runtime configuration.
;
; THIS FILE DID NOT EXIST, AND THAT IS WHY THE LIVE STREAM SHOWED THE WRONG
; WORLD. The generator saves the built world to
; /Game/Wonderland/Maps/WonderlandHub, but nothing told the packaged build to
; open it: with no GameDefaultMap, a packaged Unreal game boots the engine's own
; default map. So the stream was working perfectly and showing a near-empty
; template with whatever the default GameMode spawned — a simple blocky scene
; with proxy-looking pawns and none of the generated world.
;
; It is also why build-wonderland.sh lists Config/ as an OPTIONAL input: the
; directory was genuinely absent. That made the earlier hash crash reproducible,
; and it should have been read as evidence that a required piece was missing
; rather than only as a bash bug.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
EditorStartupMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
ServerDefaultMap=/Game/Wonderland/Maps/WonderlandHub.WonderlandHub
; A GlobalDefaultGameMode IS SET NOW, and the note that used to sit here was
; right about the reason and wrong about the conclusion. It said: this project
; has no AGameModeBase subclass, so naming one would be a fabricated setting
; that resolves to nothing. True. What it missed is what the ABSENCE resolves
; to: stock APlayerController. AWonderlandPlayerController::BeginPlay was
; therefore never called, `-CinematicView` and `-HeroCam=N` were never read, and
; every hero capture this project has ever taken was the same view no matter
; which camera was asked for. Proven on the L4 2026-08-22: HeroCam0, HeroCam3
; (1,300 uu away) and HeroCam6 returned three frames of identical composition.
;
; The repair is to make a GameMode EXIST, not to name a fiction. It sets
; PlayerControllerClass and nothing else — which pawn the player possesses stays
; a gameplay decision and is untouched, so the default streamed view is
; unchanged and only the cinematic path starts working.
GlobalDefaultGameMode=/Script/Wonderland.WonderlandGameMode

; THE PACKAGING SETTINGS MOVED TO DefaultGame.ini AND THAT IS THE WHOLE BUG.
; UnrealEd.ProjectPackagingSettings is a Game-ini config class. Declared here it
; is silently ignored, so +DirectoriesToAlwaysCook never applied and every
; material reached only by a runtime LoadObject path was stripped from the pak.
; The live L4 render came up with all 146 instanced batches grey — "material
; did not load" 146 times — and the world looked like an untextured graybox.
; It survived before batching only because each StaticMeshActor held a HARD
; reference to its material, which the cooker follows.

[/Script/Engine.RendererSettings]
; PixelStreaming2 encodes what the renderer produces; nothing here changes the
; art. These are the two settings a packaged offscreen stream actually needs.
r.CustomDepth=3

; ---------------------------------------------------------------------------
; SHADER MODEL 6, WITHOUT WHICH NANITE IS INERT
;
; MEASURED. The packaged build was running SF_VULKAN_SM5 -- the runtime log says
; so -- and NANITE REQUIRES SM6. Five primitive meshes were converted to Nanite
; and the frame rate did not move (14/13/11 against 14/15/10), because a Nanite
; mesh on a platform without SM6 silently renders its FALLBACK mesh at the full
; triangle count. Nothing errors. It is the same shape of defect as the material
; usage flag that caused the grey: the engine quietly declines to use what was
; correctly authored, and every asset-side check still passes.
;
; It matters here because this world is geometry-bound and not pixel-bound,
; proven by isolating each subsystem through the real stream:
;
;     baseline                 15, 16, 11
;     Lumen off                15, 13
;     virtual shadow maps off  15, 14
;     r.ScreenPercentage 70    13, 14      <- half the pixels, no change
;
; ~50,285 Sphere instances at roughly 1,900 triangles each is on the order of
; 95 million triangles a frame, drawn at LOD0, because the engine primitives
; ship with a single LOD. Nanite is the only lever that reduces that, and SM6
; is the price of admission.
;
; SM5 is deliberately KEPT in the list. If the driver or the platform will not
; give SM6, the build still runs -- slower, and honestly so -- rather than
; failing to start.
[/Script/LinuxTargetPlatform.LinuxTargetSettings]
+TargetedRHIs=SF_VULKAN_SM6
+TargetedRHIs=SF_VULKAN_SM5

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=True
