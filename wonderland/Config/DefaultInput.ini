; WONDERLAND — input.
;
; Enhanced Input is the only input path (the pawn binds UInputAction pointers,
; never legacy axis names). The mapping context and actions are ASSETS
; (/Game/Wonderland/Input/...) which must be authored in the editor on the
; Unreal machine — .uasset binaries cannot be honestly authored here. This file
; carries only what ini CAN carry: the defaults every UE5 project needs stated
; rather than inherited.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Gamepad + keyboard both first-class in the hub.
bAltEnterTogglesFullscreen=True
bEnableMouseSmoothing=True
