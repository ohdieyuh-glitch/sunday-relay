[/Script/Wonderland.WonderlandMiniMapSettings]
; THE MINI-MAP (founder, 2026-09-15): top right, a live photograph of the ground around the Dog, north-up on the world
; map's plan, with the district taken from the travel registry. Distances in uu.
WorldName=WONDERLAND
ViewRadiusUU=3600.0
CaptureWidthUU=10000.0
CaptureHeightUU=3000.0
; 4 per second: measured in alternating on/off windows on 2026-09-16, the base-colour photograph costs within the
; noise floor at 4 and 8 alike, so the gentler rate is kept -- fewer renders, and the plan slides under the disc anyway.
CaptureHz=4.0
RenderTargetSize=512
bCaptureShadows=False
RegionRadiusUU=7000.0

[/Script/Wonderland.WonderlandWalletHudSettings]
; THE WONDER WEB WALLET ON THE HUD (founder, 2026-09-16): top right, above the mini-map. SANDBOX ONLY.
; Unreal has no read path to the Relay wallet yet, so the only source that can show a balance is SandboxPreview, which
; mirrors what Relay's openSandboxWallet creates. These three values mirror src/relay/mission/wallet/wallet-contracts.ts
; on relay/wonderland-core-systems (wallet v1, 9b49dc60): SANDBOX_OPENING_BALANCE_MINOR, the one currency, and
; SANDBOX_FUNDS_LABEL word for word. If Relay changes them, change them here.
bShowWallet=True
Source=SandboxPreview
SandboxOpeningBalanceMinor=50000
SandboxCurrency=USD
SandboxLabel=DEVELOPMENT / SANDBOX FUNDS — NOT REAL MONEY

