; WONDERLAND — project identity.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Wonderland
ProjectID=6E1A4B22468B1D7C2F4A0B9E7C3D5A11
; THE CANONICAL COMPANY (founder ruling R-2, 2026-10-07: "Canonical company: i.Wonder Laboratories, Inc."). UBT writes
; this into the shipped Wonderland.exe's version resource
; (UEBuildWindows.cs CompanyName -> PROJECT_COMPANY_NAME -> Default.rc2 "CompanyName"); the comma survives rc.exe (tested with
; UBT's exact /D form on SDK 10.0.22621.0). NO CopyrightNotice is set here on purpose: who holds the copyright is R-1, which needs a
; formal assignment first, so the engine's placeholder stays until the founder decides. An EMPTY value would NOT be neutral: the
; resource then falls back to "Copyright Epic Games, Inc. All Rights Reserved." (Default.rc2:20-24).
CompanyName=i.Wonder Laboratories, Inc.
Description=Relay is where you build your Compound AI Agent. Wonderland is where it lives.
; Private beta: no online store, no external accounts, no telemetry beyond
; Relay's own explicit read contract.

[SectionsToSave]
; THE PLAYER'S MASCOT COLOURS ARE A PREFERENCE, SO THEY MUST SURVIVE A RELOAD (founder, 2026-09-29: "save/reload if
; customization persists -> selected secondary color restores correctly"). UE5 writes only the Game.ini sections
; listed here to the player's Saved config -- BaseGame.ini lists two engine sections -- so SaveConfig() on the
; mascot style was writing nothing, and every colour chosen (Jack Flame's fire and tie included) lasted one session.
+Section=/Script/Wonderland.WonderlandMascotStyleSettings

[/Script/UnrealEd.ProjectPackagingSettings]
; THE SHIPPING WORLD IS COOKED (founder, 2026-09-27). Golden Arrival is the packaged
; destination -- see GameDefaultMap in DefaultEngine.ini. It is a 14 KB World Partition
; stub over ~21,000 external actors, so this cook is the whole world, not one map:
; expect a long cook, and expect it to surface reference errors PIE never does. The
; hub is kept alongside as the proof of the authoring script; it is not the entry.
+MapsToCook=(FilePath="/Game/WonderlandV2/Maps/WL_V2_GoldenArrival_WP2")
+MapsToCook=(FilePath="/Game/Wonderland/Maps/WonderlandHub")

; THE FIGURES ARE LOOSE FILES, AND A COOK DOES NOT KNOW ABOUT THEM.
;
; Every voxel body in Wonderland -- the Relay Dog's seven skins, the two companions and the four LLM ghosts,
; the three Project Avatar families at three tiers each -- is a .wlvox file read from disk at runtime through
; FPaths::ProjectDir(). None of them is a .uasset, so the cooker never sees them and staging left every one
; behind. The first packaged build said so plainly:
;
;   LogWonderlandCompanion: Error: WLCOMPANION GPT 6 Astra: cannot read figure file
;     .../Windows/Wonderland/Companions/GPT6Astra.wlvox
;   LogImageUtils: Warning: Error creating texture. .../Windows/Wonderland/UiArt/ProjectBrainHologram.png
;     could not be found
;
; So the packaged game booted with no mascot, no companions and no Project Avatars, and nothing in the editor
; could ever have reported it -- in the editor those paths resolve into the project tree and always exist.
; NonUFS because they are read with ordinary file IO rather than through the pak.
; The paths are relative to Content/, not to the project root -- the staging log says so outright
; ("Unable to find directory ...\wonderland\Content\Companions"). The figures sit at the project root
; because that is where FPaths::ProjectDir() looks for them at runtime, so the entries climb out of Content.
; AND THE MATERIALS THE RUNTIME LOADS BY PATH. M_WL_VoxelGlow and M_WL_RealWater are reached with
; LoadObject from C++ and are referenced by no cooked asset, so the cooker has no way to know they are
; wanted -- the same shape of gap as the .wlvox figures below, one level up. This path is relative to
; Content/, which is where the cooker looks.
+DirectoriesToAlwaysCook=(Path="Wonderland/Materials")

+DirectoriesToAlwaysStageAsNonUFS=(Path="../Companions")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../ProjectAvatars")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../RelaySkins")
; THE SUB-AGENT CUBS TOO (2026-09-28): UWonderlandSubAgentCubSubsystem reads ProjectDir()/RelayCubs/CubGhost_*.wlvox
; exactly as the skins are read, and this list staged the skins but not the cubs -- a packaged build would summon
; every /cubs flock with no body to load.
+DirectoriesToAlwaysStageAsNonUFS=(Path="../RelayCubs")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../UiArt")
; PRIVATE BETA (2026-09-30). THE LAMPS: WonderlandPracticalLights.cpp reads WorldDesign/Look/practical_lights.json at
; runtime (1,464 street and window lights for the founder-locked approved night) and nothing staged it, so every packaged
; night was dark ("WLLIGHT practicals not loaded ... 0 practicals", B14). The other files in Look are small JSON look records.
+DirectoriesToAlwaysStageAsNonUFS=(Path="../WorldDesign/Look")
; THE BUILD'S NAME: Tools/build_beta_rc.ps1 writes BuildInfo/BuildInfo.txt ("Private Beta 0.1.0 · build <sha> · <date>"),
; and the game puts it on the window title, at the foot of the Menu and in the log (B07).
+DirectoriesToAlwaysStageAsNonUFS=(Path="../BuildInfo")
; AND THE ENGINE MATERIAL THE MISSION ORB, THE DOG'S BEAM AND PROPS AND THE WARDROBE BACKDROP LOAD BY PATH:
; /Engine/EngineDebugMaterials/LevelColorationUnlitMaterial is referenced by no cooked asset, so the packaged build drew
; all of them in the default material ("WLMISSION no material ...", B13).
+DirectoriesToAlwaysCook=(Path="/Engine/EngineDebugMaterials")
; AND THE ENGINE'S NEURAL DENOISER STAYS IN THE EDITOR (r16reh12, 2026-10-13). Wonderland.uproject enables NNEDenoiser for the
; Editor target only (c1527061), but the plugin's own Config/Game.ini adds +DirectoriesToAlwaysCook=(Path="/NNEDenoiser"), and the
; cook runs in the editor, where the plugin is mounted. So r16reh12's cook took all 24 of its assets for the game and failed on 18
; ("imports class /Script/NNEDenoiser..., which is in a module that is not available on the platform"). Never-cook wins over it.
+DirectoriesToNeverCook=(Path="/NNEDenoiser")

