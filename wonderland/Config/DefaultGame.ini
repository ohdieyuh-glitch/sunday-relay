[/Script/UnrealEd.ProjectPackagingSettings]
; THE SHIPPING WORLD IS COOKED (founder, 2026-09-27). Golden Arrival is the packaged
; destination -- see GameDefaultMap in DefaultEngine.ini. It is a 14 KB World Partition
; stub over ~21,000 external actors, so this cook is the whole world, not one map:
; expect a long cook, and expect it to surface reference errors PIE never does. The
; hub is kept alongside as the proof of the authoring script; it is not the entry.
+MapsToCook=(FilePath="/Game/WonderlandV2/Maps/WL_V2_GoldenArrival_WP2")
+MapsToCook=(FilePath="/Game/Wonderland/Maps/WonderlandHub")

; THE FIGURES ARE LOOSE FILES, AND A COOK DOES NOT KNOW ABOUT THEM.
;
; Every voxel body in Wonderland -- the Relay Dog's seven skins, the two companions and the four LLM ghosts,
; the three Project Avatar families at three tiers each -- is a .wlvox file read from disk at runtime through
; FPaths::ProjectDir(). None of them is a .uasset, so the cooker never sees them and staging left every one
; behind. The first packaged build said so plainly:
;
;   LogWonderlandCompanion: Error: WLCOMPANION GPT 6 Astra: cannot read figure file
;     .../Windows/Wonderland/Companions/GPT6Astra.wlvox
;   LogImageUtils: Warning: Error creating texture. .../Windows/Wonderland/UiArt/ProjectBrainHologram.png
;     could not be found
;
; So the packaged game booted with no mascot, no companions and no Project Avatars, and nothing in the editor
; could ever have reported it -- in the editor those paths resolve into the project tree and always exist.
; NonUFS because they are read with ordinary file IO rather than through the pak.
; The paths are relative to Content/, not to the project root -- the staging log says so outright
; ("Unable to find directory ...\wonderland\Content\Companions"). The figures sit at the project root
; because that is where FPaths::ProjectDir() looks for them at runtime, so the entries climb out of Content.
; AND THE MATERIALS THE RUNTIME LOADS BY PATH. M_WL_VoxelGlow and M_WL_RealWater are reached with
; LoadObject from C++ and are referenced by no cooked asset, so the cooker has no way to know they are
; wanted -- the same shape of gap as the .wlvox figures below, one level up. This path is relative to
; Content/, which is where the cooker looks.
+DirectoriesToAlwaysCook=(Path="Wonderland/Materials")

+DirectoriesToAlwaysStageAsNonUFS=(Path="../Companions")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../ProjectAvatars")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../RelaySkins")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../UiArt")

