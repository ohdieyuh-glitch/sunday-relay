; Wonderland — project identity for the packaged build.
[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Wonderland
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Wonderland")

; MOVED HERE FROM DefaultEngine.ini. ProjectPackagingSettings is read from
; the GAME ini; in the Engine ini it parses and does nothing, which cost a
; full cook and a grey world on the L4.
[/Script/UnrealEd.ProjectPackagingSettings]
; COOK THE MAP EXPLICITLY. BuildCookRun with no map list cooks what it can infer
; from the maps settings; stating it means a cook that omitted WonderlandHub is
; a build failure rather than a discovery made from a browser.
+MapsToCook=(FilePath="/Game/Wonderland/Maps/WonderlandHub")
; The generated world imports its textures, audio, materials and VFX under
; /Game/Wonderland/**. Referenced assets are cooked automatically, but the
; directory is named so an asset reached only at runtime is not dropped.
+DirectoriesToAlwaysCook=(Path="/Game/Wonderland")
