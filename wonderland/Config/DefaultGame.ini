[/Script/Wonderland.WonderlandUsageHudSettings]
; WHO FEEDS THE USAGE HUD. DevelopmentPreview draws both meters from the Preview state below and labels
; itself DEVELOPMENT PREVIEW (founder request 2026-09-13: see the finished HUD at full capacity). When
; Julius's usage authority is connected to Wonderland, set UsageSource=JuliusUsageAuthority -- nothing else
; changes. See Source/Wonderland/WonderlandUsagePreview.h.
UsageSource=DevelopmentPreview
Preview=(CompoundAgentPercent=100.000000,SingleAgentPercent=100.000000,LlmCompanionPercent=100.000000)
; THE THIRD, WHITE LLM COMPANION METER (founder request 2026-09-15): nested beside the blue Single Agent
; stroke, which slims to make room; labels stay under the art. A preview composition -- the usage contract
; has no LLM Companion channel yet. False restores the approved two-meter HUD exactly.
bShowLlmCompanionMeter=True

[/Script/Wonderland.WonderlandCompanionPreviewSettings]
; THE COMPANION PREVIEW (founder request 2026-09-15): an imported LLM Companion and an imported Jhinn AI Agent
; floating beside the Relay Dog, each with its own terminal panel. Nothing is imported or connected; both
; terminals say WAITING. Figures are text under wonderland/Companions/ (wonderland/Tools/companion_figures.py).
; Never shown in Shipping. See Source/Wonderland/WonderlandCompanionSubsystem.h.
bShowCompanionPreview=True
FigureDirectory=Companions
LlmCompanionName=GPT 6 Astra
LlmCompanionFigure=GPT6Astra.wlvox
; Placement measured from the play camera in PIE (zc_offset_probe, 2026-09-15): at +-135 uu the LLM Companion sat behind
; its own terminal panel; a little ahead and closer in keeps both beside the Dog and clear of the panels. The follow
; camera sits over the right shoulder, so the left companion is drawn in further than the right.
LlmCompanionOffset=(X=20.000000,Y=-88.000000,Z=0.000000)
AgentName=Claude Code Fable 5
AgentFigure=ClaudeCodeFable5.wlvox
AgentOffset=(X=20.000000,Y=110.000000,Z=0.000000)

