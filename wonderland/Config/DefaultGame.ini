[/Script/Wonderland.WonderlandMiniMapSettings]
; THE MINI-MAP (founder, 2026-09-15): top right, a live photograph of the ground around the Dog, north-up on the world
; map's plan, with the district taken from the travel registry. Distances in uu.
WorldName=WONDERLAND
ViewRadiusUU=3600.0
CaptureWidthUU=10000.0
CaptureHeightUU=3000.0
; 4 per second: measured in alternating on/off windows on 2026-09-16, the base-colour photograph costs within the
; noise floor at 4 and 8 alike, so the gentler rate is kept -- fewer renders, and the plan slides under the disc anyway.
CaptureHz=4.0
RenderTargetSize=512
bCaptureShadows=False
RegionRadiusUU=7000.0
