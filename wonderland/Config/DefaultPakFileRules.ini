; wonderland/Config/DefaultPakFileRules.ini  (NEW FILE; drafted by SA3 for CORE on 2026-10-07; not yet applied)
;
; FOUNDER 2026-10-07: the ENGINE copy of DroidSansMono.ttf must not ship. It is "Version 1.00 build 107", sha256 793a6342...,
; and its own name table carries Ascender's per-computer EULA. Slate.Build.cs:54 stages
; $(EngineDir)/Content/Slate/...*.ttf as UFS, so without this rule the file goes into the pak.
; The HUD's WonderlandUi::Mono() loads the project's Apache-2.0 AOSP build of the same design instead
; (Content/Slate/Fonts/DroidSansMono-AOSP.ttf, staged by Slate.Build.cs:67 $(ProjectDir)/Content/Slate/...).
;
; Syntax, from UE 5.8 UAT (Engine/Source/Programs/AutomationTool/Scripts/CopyBuildToStagingDirectory.Automation.cs):
;   3153  ConfigCache.ReadHierarchy(ConfigHierarchyType.PakFileRules, ...)   -> Base/Default{TYPE}.ini with TYPE=PakFileRules
;         (UnrealBuildTool/Configuration/Ini/ConfigHierarchy.cs:61-63 and :999 "{PROJECT}/Config/Default{TYPE}.ini")
;   3168  every section is one rule; 3256 bExcludeFromPaks; 3258 bOverrideChunkManifest; 3342-3357 +Files= entries are added
;         to a FileFilter, and 3100 matches that filter against StagingFile.Key = the SOURCE path (3772
;         UnrealPakResponseFile.Add(Src.FullName, Dest)). FileFilter.NormalizePath turns '\' into '/', and "..." matches
;         any number of directories.
;   3448-3520 ApplyPakFileRules: first match wins. In a chunked build the exclusion overrides the cooker's assignment
;         ONLY IF bOverrideChunkManifest=true (3473-3479). Hence it is set here, as the engine's own
;         [ExcludeContentForMobile] example does. 3511 logs "Excluding {file} from pak files".
;   No Platforms= and no Targets= line, so the rule applies to every platform and every configuration (3201, 3224).
; The pattern's last token is "DroidSansMono.ttf" under "Engine/", so it cannot match
; Wonderland/Content/Slate/Fonts/DroidSansMono-AOSP.ttf.

[ExcludeEngineDroidSansMono]
bExcludeFromPaks=true
bOverrideChunkManifest=true
+Files=".../Engine/Content/Slate/Fonts/DroidSansMono.ttf"
