name: Julius real sibling infrastructure
on:
  pull_request:
    paths: ['src/relay/mission/julius/**','src/relay/persistence/**','relay-bridge/**','src/relay/workspace/julius-tools/**','scripts/julius-*','.github/julius-*','.github/wait-for-executor.sh','.github/workflows/julius-real-infra.yml','.github/workflows/julius-first-live-mission.yml','package*.json','src/relay/workspace/**','.github/julius-missions/**','.github/julius-learning-registrations/**','.github/julius-mission-slice/**','JULIUS_HARNESS_MANIFEST.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sibling-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JULIUS_CALLER_ID: julius-prod
      JULIUS_TENANT_ID: tenant
      JULIUS_OTHER_CALLER_ID: julius-other
      EXECUTOR_KEY_ID: ci-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run relay:executor:build && npm run relay:sibling-e2e:build

      - name: Build pinned sandbox and executor-side images
        id: images
        run: |
          mkdir -p /tmp/julius-ci-build
          cp scripts/julius-docker-executor.sh /tmp/julius-ci-build/julius-executor
          printf '%s\n' 'FROM node:22-bookworm-slim' 'RUN apt-get update && apt-get install -y --no-install-recommends util-linux git ca-certificates procps && rm -rf /var/lib/apt/lists/*' 'COPY julius-executor /usr/local/bin/julius-executor' 'RUN chmod 0555 /usr/local/bin/julius-executor' > /tmp/julius-ci-build/Sandboxfile
          sandbox_image=$(docker build -q -f /tmp/julius-ci-build/Sandboxfile /tmp/julius-ci-build)
          printf '%s\n' 'FROM node:22-bookworm-slim' 'RUN apt-get update && apt-get install -y --no-install-recommends docker.io ca-certificates && rm -rf /var/lib/apt/lists/*' > /tmp/julius-ci-build/Executorfile
          executor_image=$(docker build -q -f /tmp/julius-ci-build/Executorfile /tmp/julius-ci-build)
          echo "sandbox=$sandbox_image" >> "$GITHUB_OUTPUT"
          echo "executor=$executor_image" >> "$GITHUB_OUTPUT"

      - name: Create executor-private state, signing identity and per-operation credentials
        id: identity
        run: |
          # One workspace root, one directory per tenant, and inside each the workspace itself on its OWN
          # kernel-sized filesystem. The tenant directory stays unwritable by the sandbox user so the
          # workspace cannot be renamed out from under its mount; the tmpfs size is what makes the declared
          # workspaceBytes an enforced ceiling rather than a recorded number.
          mkdir -p /tmp/julius-executor/receipts /tmp/julius-executor/ledger \
                   /tmp/julius-workspace/tenant/ws /tmp/julius-workspace/other-tenant/ws
          chmod 0700 /tmp/julius-executor /tmp/julius-executor/receipts /tmp/julius-executor/ledger
          chmod 0755 /tmp/julius-workspace /tmp/julius-workspace/tenant /tmp/julius-workspace/other-tenant
          for tenant in tenant other-tenant; do
            # nr_inodes matters as much as size: tmpfs takes its inode count from host RAM, so without it a
            # 4 MiB workspace can still pin hundreds of MiB of kernel memory that df and du both report as zero.
            sudo mount -t tmpfs -o size=4194304,nr_inodes=4096,mode=0777,nosuid,nodev tmpfs "/tmp/julius-workspace/$tenant/ws"
          done
          printf 'fixture\n' > /tmp/julius-workspace/tenant/ws/fixture.txt
          printf 'other tenant private\n' > /tmp/julius-workspace/other-tenant/ws/private.txt
          df -B1 --output=size,target /tmp/julius-workspace/tenant/ws /tmp/julius-workspace/other-tenant/ws
          df --output=itotal,target /tmp/julius-workspace/tenant/ws /tmp/julius-workspace/other-tenant/ws
          openssl genpkey -algorithm ED25519 -out /tmp/julius-executor/private.pem
          openssl pkey -in /tmp/julius-executor/private.pem -pubout -out /tmp/julius-public.pem
          chmod 0600 /tmp/julius-executor/private.pem
          # Two independent root secrets: one per tenant. Neither ever reaches a Julius container.
          primary=$(openssl rand -base64 33 | tr -d '\n')
          secondary=$(openssl rand -base64 33 | tr -d '\n')
          operator=$(openssl rand -base64 33 | tr -d '\n')
          echo "::add-mask::$primary"
          echo "::add-mask::$secondary"
          echo "::add-mask::$operator"
          # A tenant caller holds only the tenant operations, so it is handed only those credentials.
          tenant_ops='create prepare execute cancel destroy inspect artifacts'
          scoped=$(EXECUTOR_CREDENTIAL_ROOT="$primary" node scripts/julius-derive-scoped-credentials.mjs --json $tenant_ops)
          other_scoped=$(EXECUTOR_CREDENTIAL_ROOT="$secondary" node scripts/julius-derive-scoped-credentials.mjs --json $tenant_ops)
          operator_scoped=$(EXECUTOR_CREDENTIAL_ROOT="$operator" node scripts/julius-derive-scoped-credentials.mjs --json discover reconcile quarantine)
          for root in "$primary" "$secondary" "$operator"; do
            EXECUTOR_CREDENTIAL_ROOT="$root" node scripts/julius-derive-scoped-credentials.mjs --values | while read -r value; do echo "::add-mask::$value"; done
          done
          callers=$(JULIUS_PRIMARY_ROOT="$primary" JULIUS_SECONDARY_ROOT="$secondary" JULIUS_OPERATOR_ROOT="$operator" node scripts/julius-ci-callers.mjs)
          echo "callers=$callers" >> "$GITHUB_OUTPUT"
          echo "scoped=$scoped" >> "$GITHUB_OUTPUT"
          echo "other_scoped=$other_scoped" >> "$GITHUB_OUTPUT"
          echo "operator_scoped=$operator_scoped" >> "$GITHUB_OUTPUT"

      - name: Start PostgreSQL 16 and the independent executor control plane
        env:
          SANDBOX_IMAGE: ${{ steps.images.outputs.sandbox }}
          EXECUTOR_IMAGE: ${{ steps.images.outputs.executor }}
          EXECUTOR_CALLERS: ${{ steps.identity.outputs.callers }}
        run: |
          docker network create julius-sibling
          docker run -d --name julius-postgres --network julius-sibling -e POSTGRES_USER=julius -e POSTGRES_PASSWORD=julius -e POSTGRES_DB=julius postgres:16-bookworm
          for i in $(seq 1 40); do docker exec julius-postgres pg_isready -U julius && break; sleep 1; done
          docker run -d --name julius-executor --network julius-sibling \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v /tmp/julius-executor:/tmp/julius-executor -v /tmp/julius-workspace:/tmp/julius-workspace -w "$GITHUB_WORKSPACE" \
            -e PGHOST=julius-postgres -e PGPORT=5432 -e PGUSER=julius -e PGPASSWORD=julius -e PGDATABASE=julius \
            -e EXECUTOR_RECEIPT_ROOT=/tmp/julius-executor/receipts \
            -e EXECUTOR_LEDGER_ROOT=/tmp/julius-executor/ledger -e EXECUTOR_SIGNING_KEY_PATH=/tmp/julius-executor/private.pem \
            -e EXECUTOR_KEY_ID=ci-key -e EXECUTOR_RUNTIME_ID=executor-ci -e EXECUTOR_VERSION=docker-executor.v1 \
            -e EXECUTOR_WORKSPACE_ROOT=/tmp/julius-workspace -e EXECUTOR_TENANT_WORKSPACE_ROOT=/tmp/julius-workspace -e JULIUS_SANDBOX_IMAGE="$SANDBOX_IMAGE" \
            -e EXECUTOR_CALLERS="$EXECUTOR_CALLERS" -e EXECUTOR_SECRET_ENV=executor-only \
            "$EXECUTOR_IMAGE" node dist-relay-executor/main.cjs
          ./.github/wait-for-executor.sh

      # Julius shares only the executor's network namespace: it has no Docker socket, no signing key,
      # no receipt store, no ledger and none of the executor's environment. Every one of those is probed.
      - name: Julius has no Docker, key, receipt or ledger authority
        run: ./.github/julius-phase.sh isolation
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: Scoped envelope, durable reservation, signed BEFORE, real effect, signed AFTER
        run: ./.github/julius-phase.sh initial
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: Julius died before settling; a restarted Julius settles exactly once without re-executing
        run: ./.github/julius-phase.sh settle
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: A dangerous effect starts and an effect that has not started is queued
        run: ./.github/julius-phase.sh interrupt-start
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: Destroy both in-flight sandboxes under the executor, then restart it
        run: |
          for sandbox in sibling-interrupt-started sibling-interrupt-unstarted; do
            id=$(docker ps -aq --filter "label=julius.sandbox=$sandbox")
            test -n "$id" || { echo "no container for $sandbox"; docker ps -a; exit 1; }
            docker rm -f $id
          done
          docker restart julius-executor
          ./.github/wait-for-executor.sh

      - name: An interrupted execution answers STARTED_UNKNOWN_OUTCOME and is never replayed blind
        run: ./.github/julius-phase.sh interrupt-verify
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: After the executor restart the terminal material replays with zero second effect
        run: ./.github/julius-phase.sh replay
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: Completion authority settles a task outcome exactly once
        run: ./.github/julius-phase.sh complete
        env: { SCOPED: '${{ steps.identity.outputs.scoped }}', OTHER_SCOPED: '${{ steps.identity.outputs.other_scoped }}', OPERATOR_SCOPED: '${{ steps.identity.outputs.operator_scoped }}' }

      - name: Plant an unowned Julius-labelled container for reconciliation
        env: { SANDBOX_IMAGE: '${{ steps.images.outputs.sandbox }}' }
        run: docker create --label julius.sandbox=orphan-sandbox "$SANDBOX_IMAGE" sleep infinity

      - name: Provider-independent evaluations against the real infrastructure
        run: ./.github/julius-phase.sh evals
        env:
          SCOPED: ${{ steps.identity.outputs.scoped }}
          OTHER_SCOPED: ${{ steps.identity.outputs.other_scoped }}
          OPERATOR_SCOPED: ${{ steps.identity.outputs.operator_scoped }}
          JULIUS_ORPHAN_EXPECTED: '1'

      - name: Executor topology evidence
        if: always()
        run: |
          docker inspect julius-executor --format 'executor_mounts={{range .Mounts}}{{.Destination}}:{{.RW}} {{end}}' 2>/dev/null || true
          docker logs julius-executor 2>&1 | tail -n 200 || true

      - name: Cleanup
        if: always()
        run: |
          docker ps -aq --filter 'label=julius.sandbox' | xargs -r docker rm -f 2>/dev/null || true
          docker rm -f julius-executor julius-postgres 2>/dev/null || true
          docker network rm julius-sibling 2>/dev/null || true
          for tenant in tenant other-tenant; do sudo umount "/tmp/julius-workspace/$tenant/ws" 2>/dev/null || true; done

  first-live-topology:
    # THE PROVIDER-FREE HALF OF THE FIRST-LIVE MISSION, ON REAL DOCKER, ON EVERY
    # RELEVANT PR. Free dry run #2 (GitHub Actions run 33635375764) failed inside
    # the executor with a masked `executor_failure` that nothing offline could
    # reproduce: the sandbox round trip is production code that had only ever
    # met a fake shell. This job runs the SAME scripts the mission runs
    # (images, identity, workspace, executor launch, key boundary) and the SAME
    # preflight bundle, with no provider credential anywhere — and it runs once
    # per receipt transport: the executor-private receipt root the mission
    # started with, and the host-visible one the sibling job above has always
    # used. The executor's own diagnostics (safe lines only) are printed for
    # both, so a refusal names its stage and class instead of vanishing.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        receipts: [executor-private, host-visible]
    env:
      JULIUS_CALLER_ID: julius-live
      JULIUS_TENANT_ID: tenant
      JULIUS_PROJECT_ID: prj-julius-first-live
      EXECUTOR_KEY_ID: julius-live-key
      JULIUS_FLEET_ROOT: /tmp/julius-workspace
      JULIUS_WORKSPACE: /tmp/julius-workspace/tenant/ws
      JULIUS_PUBLIC_KEY_PATH: /tmp/julius-public.pem
      JULIUS_EXECUTOR_ENDPOINT: http://127.0.0.1:8787/
      JULIUS_EXECUTOR_ALLOW_LOOPBACK: '1'
      PGUSER: julius
      PGDATABASE: julius
      # The one topology switch. `host-visible` is the mission's transport and must
      # pass; `executor-private` is the shape dry runs #1 and #2 ran and is kept as
      # a NEGATIVE regression: it must be refused by the host daemon at exactly
      # the point and with exactly the code proven on 2026-09-02, and nothing else.
      JULIUS_RECEIPT_HOST_ROOT: ${{ matrix.receipts == 'host-visible' && '/tmp/julius-executor/receipts' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run relay:executor:build && npm run relay:julius:preflight:build
      - name: Build the pinned sandbox and executor images
        id: images
        run: ./.github/julius-live-images.sh
      - name: Create the ephemeral scoped credentials
        id: identity
        run: ./.github/julius-live-identity.sh
      - name: Provision the disposable mission workspace
        env:
          # The regression provisions the FIRST mission's fixture; the script
          # itself is generic and refuses to guess which mission it is seeding.
          JULIUS_MISSION_DIR: .github/julius-missions/julius-first-live
        run: ./.github/julius-live-workspace.sh
      - name: Start PostgreSQL 16 and the independent executor (${{ matrix.receipts }} receipts)
        env:
          SANDBOX_IMAGE: ${{ steps.images.outputs.sandbox }}
          EXECUTOR_IMAGE: ${{ steps.images.outputs.executor }}
          EXECUTOR_CREDENTIAL_ROOT: ${{ steps.identity.outputs.root }}
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: ./.github/julius-live-executor.sh
      - name: The signing key is beyond every file-reading path, whichever receipt transport is in use
        run: ./.github/julius-live-key-boundary.sh
      - name: The receipt transport's boundary holds (${{ matrix.receipts }})
        run: ./.github/julius-live-receipt-boundary.sh
      - name: Preflight round trip (${{ matrix.receipts }} receipts)
        id: preflight
        env:
          JULIUS_SCOPED_CREDENTIALS: ${{ steps.identity.outputs.scoped }}
        run: |
          set -uo pipefail
          set +e
          npm run relay:julius:preflight | tee preflight.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          umask 077
          diagnostics=$(mktemp)
          docker logs julius-executor 2>&1 | grep -E '^executor_diagnostic ' > "$diagnostics" || true
          echo "--- executor diagnostics (safe lines only) ---"
          cat "$diagnostics"
          case '${{ matrix.receipts }}' in
            host-visible)
              # THE MISSION'S TRANSPORT: the whole provider-free preflight passes, and the
              # executor refused nothing along the way.
              if [ "$status" -ne 0 ]; then echo "first_live_topology_failed:host-visible exit=$status" >&2; exit 1; fi
              if [ -s "$diagnostics" ]; then echo 'first_live_topology_failed:host-visible executor refused a request' >&2; exit 1; fi
              echo 'POSITIVE ROUND TRIP OK: host-visible receipts carried create, prepare, execute, receipts, diff and destroy.' ;;
            executor-private)
              # THE NEGATIVE REGRESSION. Proven 2026-09-02 (runs 33667743669, 33685880591): with a
              # legitimate identity, a receipt root inside the executor's own layer is refused by
              # the host daemon at prepareWorkspace, and only there. This entry is GREEN when that
              # exact refusal is observed; a pass, a different stage, or a different class is a
              # regression of the architecture this job protects.
              expected='executor_diagnostic operation=prepare result=sandbox_create_failed class=bind_source_missing status=500'
              if [ "$status" -eq 0 ]; then echo 'negative_regression_failed:executor-private receipts unexpectedly passed the preflight' >&2; exit 1; fi
              if ! grep -q 'PREFLIGHT FAILED: EXECUTOR_UNAVAILABLE:sandbox_create_failed' preflight.log; then
                echo 'negative_regression_failed:executor-private did not fail with sandbox_create_failed' >&2; exit 1
              fi
              if ! grep -qxF "$expected" "$diagnostics"; then
                echo 'negative_regression_failed:executor-private refused for a different stage or class' >&2; exit 1
              fi
              if grep -vxF "$expected" "$diagnostics" | grep -q .; then
                echo 'negative_regression_failed:executor-private produced an additional refusal' >&2; exit 1
              fi
              echo 'NEGATIVE REGRESSION OK: executor-private receipts were refused by the host daemon at prepareWorkspace with class=bind_source_missing, exactly as proven.' ;;
          esac
          rm -f "$diagnostics"

      - name: A throwaway database the real-PostgreSQL suites are allowed to write
        # THE SUITES READ ONLY JULIUS_TEST_DATABASE_URL (#288), so that a developer's inherited
        # DATABASE_URL can never reach a test. Nothing in this workflow set it, so from 09-28
        # every suite below ran as `todo` and its step still passed: run 36587881843 executed 0
        # of 28 real-PostgreSQL cases, and 1 of 18 in the preflight identity regression. ONE
        # database for all of them: every suite carries random identities, so they can share it,
        # and none of them reaches the job's own `julius` database.
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?the executor launch step exports it; without it PostgreSQL never came up}"
          docker exec -e PGPASSWORD julius-postgres createdb -U "$PGUSER" julius_suites
          echo "JULIUS_TEST_DATABASE_URL=${DATABASE_URL%/*}/julius_suites" >> "$GITHUB_ENV"
      - name: Preflight identity regression against real PostgreSQL (dry run 33635375764)
        # The executor's foreign keys, exercised through the executor's own repository: the
        # preflight's fixture is accepted, removing the invocation seed brings 23503 back,
        # another preflight's rows cannot satisfy this one, cleanup leaves nothing behind.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
        run: npx vitest run scripts/julius-live-preflight-identity.test.ts
      - name: Two runs in one real PostgreSQL never share an architecture identity
        # `julius_tasks.task_id` and `julius_brain_entries.entry_id` are global primary keys;
        # the architecture check task and the accepted-architecture entry must carry the run.
        # A Map cannot hold those constraints, so the in-memory proof alone cannot close this.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
        run: npx vitest run src/relay/persistence/julius-run-scoped-identity.real-postgres.test.ts
      - name: A renewed lease holds and a reclaimed one is fenced, on real PostgreSQL
        # The heartbeat had no production caller, so a Coding Agent attempt longer than its
        # lease could be reclaimed mid-session. The renewal's two rules on the real schema:
        # a legitimate holder keeps its lease ahead of time, a reclaimed holder's renewal is
        # refused by the generation fence, and no renewal writes past the hold bound.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
        run: npx vitest run src/relay/persistence/julius-lease-renewal.real-postgres.test.ts
      - name: Attempt attribution cannot collide, leak or be overwritten, on real PostgreSQL
        # A failed attempt's change set and a retry's are separate rows keyed by their own
        # attempt: the second cannot overwrite the first, a replay writes nothing twice, and
        # a read for one task or run never sees another's. That is what makes the undo
        # decision reconstructable by a process that did not write it.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
        run: npx vitest run src/relay/persistence/julius-attempt-attribution.real-postgres.test.ts
      - name: One event append contract, on real PostgreSQL as in memory
        # `jsonb` does not preserve key order, so comparing a stored payload with the one
        # just built refused genuine replays here while the in-memory store compared the id
        # alone and dropped a different event silently. The same cases run against both.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
        run: npx vitest run src/relay/persistence/julius-event-append.real-postgres.test.ts
      - name: A decision and the history that explains it are one transaction
        # The events announcing a decision — and announcing what it released — used to be
        # appended after that write returned, so a process dying in between left a decision
        # no history could account for, and no later sweep ever wrote them: the resume skips
        # a task that already has a decision. Only a real database shows the rollback.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
        run: npx vitest run src/relay/persistence/julius-decision-history.real-postgres.test.ts
      - name: Every real-PostgreSQL suite in the tree runs, and not one of its cases is todo
        # THE STEPS ABOVE NAME FIVE SUITES; THE TREE HOLDS MORE, and a suite nobody wired never
        # ran here at all (the lifecycle channel's, the Wonderland seam's, the claim standing's,
        # the criteria scope's, the C.A.R.D. approval gate's). This runs every file whose path
        # says `real-postgres`, so a new suite is covered the day it lands, and it FAILS when a
        # single case reports todo or skipped: a suite that did not run is not a suite that
        # passed, which is exactly what the five steps above could not tell apart.
        if: ${{ !cancelled() }}
        env:
          JULIUS_REAL_POSTGRES: '1'
          # DECISION C (C-10): the learning store round trip dumps and restores with the server's own major. The
          # runner image's PostgreSQL 16 client lives here; a missing one FAILS the suite by name, never todo.
          JULIUS_TEST_PG_BINDIR: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          : "${JULIUS_TEST_DATABASE_URL:?the throwaway-database step exports it}"
          # One tool per line: set -e stops only on the LAST command of an && list.
          "$JULIUS_TEST_PG_BINDIR/pg_dump" --version
          "$JULIUS_TEST_PG_BINDIR/pg_restore" --version
          "$JULIUS_TEST_PG_BINDIR/psql" --version
          # ROW 13(iii): the three suites gated only on a test database run here too, under the same todo gate.
          npx vitest run real-postgres julius-live-chain.e2e julius-recovery-drill julius-drill-support --reporter=default --reporter=json --outputFile=/tmp/julius-real-postgres.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("/tmp/julius-real-postgres.json", "utf8"));
            const files = report.testResults.map((file) => file.name.replace(`${process.cwd()}/`, ""));
            const idle = report.numTodoTests + report.numPendingTests;
            console.log(`real-PostgreSQL suites: ${files.length} files, ${report.numPassedTests} passed, ${report.numFailedTests} failed, ${idle} todo/skipped`);
            for (const file of files) console.log(`  ${file}`);
            if (files.length === 0) { console.error("real_postgres_no_suites: no file matched"); process.exit(1); }
            if (idle > 0) { console.error(`real_postgres_not_run: ${idle} case(s) did not run`); process.exit(1); }
          '
      - name: Every evidence query holds against the migrated schema
        # Runs whether or not the preflight passed: the preflight applies the migrations
        # before its executor round trip, so the schema is present at today's failure too.
        if: ${{ !cancelled() }}
        # The preflight above applied the migrations. The mission's own dump script runs here
        # against that schema, so a stale table or column name fails this PR instead of
        # silently becoming an `unavailable` artifact file after a paid run.
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          ./.github/julius-live-evidence-dump.sh /tmp/julius-evidence-check
          failed=0
          for file in /tmp/julius-evidence-check/*.tsv; do
            if grep -qx 'unavailable' "$file"; then echo "evidence_query_invalid:$(basename "$file")" >&2; failed=1; else echo "$(basename "$file"): $(head -n 1 "$file")"; fi
          done
          rm -rf /tmp/julius-evidence-check
          [ "$failed" -eq 0 ]
      - name: The Julius capability drills hold on real PostgreSQL
        # WHY THIS JOB. The Beta Gate reports RESTART / RECOVERY as CAPABILITY
        # PROVEN only on a drill attestation whose recorded digests still match
        # the tree it is read in — so the drill is the thing that must not rot,
        # and it needs what only this job already has: a real PostgreSQL, a real
        # wall clock for a lease to expire against, and two real processes. No
        # provider credential is anywhere near it; the three C.A.R.D. adapters
        # are fakes and the recovery path is production.
        #
        # ITS OWN DATABASE. The drill bootstraps a mission of its own, and one
        # mission's rows belong in the bundle of the mission that ran it, never
        # mixed into another run's evidence.
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?the executor launch step exports it; without it PostgreSQL never came up}"
          # ONE DATABASE PER DRILL. Each bootstraps a mission of its own, and a
          # drill that could read another's rows is not testimony — the drills
          # refuse a database that already holds their run for the same reason.
          for drill in recovery-drill failure-recovery-drill repair-loop-drill; do
            db="julius_${drill//-/_}"
            docker exec -e PGPASSWORD julius-postgres createdb -U "$PGUSER" "$db"
            DATABASE_URL="${DATABASE_URL%/*}/$db" \
              npm run "julius:$drill" --silent -- --out /tmp/julius-capability-proofs
          done
          # AND THE GATE MUST ACCEPT WHAT THEY FILED. A drill that passes and
          # files an attestation the gate then refuses — a renamed column, a file
          # added to a row's probe and not to that drill's exercised list, a
          # ledger one drill truncated over another's — is a drill that proves
          # nothing, and this is the only place the two meet.
          node --input-type=module -e '
            import { evaluate } from "./scripts/wonderland-beta-gate.mjs";
            const report = evaluate(null, { capabilityDir: "/tmp/julius-capability-proofs" });
            let failed = 0;
            for (const id of ["RESTART / RECOVERY", "FAILURE RECOVERY", "REPAIR LOOP"]) {
              const row = report.results.find((value) => value.id === id);
              if (!row || row.capability !== "PROVEN") {
                console.error(`capability_proof_refused_by_gate: ${id} - ${row ? row.capability : "no such row"} - ${row ? row.capabilityBasis : ""}`);
                failed += 1;
                continue;
              }
              console.log(`${id}: capability ${row.capability} (mission axis UNKNOWN: no bundle) - ${row.capabilityBasis}`);
            }
            if (failed > 0) process.exit(1);
          '
          rm -rf /tmp/julius-capability-proofs
      - name: Executor topology evidence
        if: always()
        run: |
          docker inspect julius-executor --format 'executor_mounts={{range .Mounts}}{{.Destination}}:{{.RW}} {{end}}' 2>/dev/null || true
          echo "receipt_root_host=${JULIUS_RECEIPT_HOST_ROOT:-none}"
          if [ -n "${JULIUS_RECEIPT_HOST_ROOT:-}" ]; then sudo stat -c 'host_receipt_root=%n owner=%U:%G mode=%a' "$JULIUS_RECEIPT_HOST_ROOT" || true; fi
          docker logs julius-executor 2>&1 | grep -E '^executor_(ready|diagnostic)[ :]' || true
      - name: Cleanup
        if: always()
        run: |
          docker ps -aq --filter 'label=julius.sandbox' | xargs -r docker rm -f 2>/dev/null || true
          docker rm -f julius-executor julius-postgres 2>/dev/null || true
          rm -f /tmp/julius-public.pem 2>/dev/null || true
          sudo umount /tmp/julius-workspace/tenant/ws 2>/dev/null || true
          sudo rm -rf /tmp/julius-workspace /tmp/julius-executor 2>/dev/null || true
  real-infra-julius:
    # ROW 13(iii) (founder ruling R-13iii-VENUE; Second: its OWN job). real-infra-julius.test.ts drives REAL Docker
    # sandboxes, and its quarantine case reconciles every `julius.sandbox` container on the daemon with an empty receipts
    # store, so it must never share a daemon with a live executor. The same pinned images; a throwaway PostgreSQL; the
    # same todo gate as the real-PostgreSQL step: a case that did not run is not a case that passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run relay:executor:build && npm run relay:julius:preflight:build
      - name: Build the pinned sandbox and executor images
        id: images
        run: ./.github/julius-live-images.sh
      - name: A throwaway PostgreSQL 16 the real-infrastructure suite may write
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          docker run -d --name julius-real-infra-pg -e POSTGRES_USER=julius -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=julius \
            -p 127.0.0.1:55432:5432 postgres:16-bookworm >/dev/null
          # The image's init runs a TEMPORARY server on the socket only (listen_addresses=''), then restarts it: a socket
          # probe can answer from that server just before it shuts down (#316). Only the final server answers over TCP.
          for i in $(seq 1 60); do docker exec julius-real-infra-pg pg_isready -h 127.0.0.1 -p 5432 -U julius -d julius >/dev/null 2>&1 && break; sleep 1; done
          docker exec julius-real-infra-pg pg_isready -h 127.0.0.1 -p 5432 -U julius -d julius
          created=0
          for i in $(seq 1 10); do docker exec julius-real-infra-pg createdb -U julius julius_suites && { created=1; break; }; sleep 1; done
          [ "$created" = 1 ] || { echo 'real_infra_pg_not_ready: createdb never succeeded' >&2; exit 1; }
          printf 'JULIUS_TEST_DATABASE_URL=postgresql://%s:%s@127.0.0.1:55432/julius_suites\n' julius "$password" >> "$GITHUB_ENV"
      - name: The real-infrastructure suite runs on real Docker and real PostgreSQL, and not one of its cases is todo
        env:
          JULIUS_REAL_INFRA: '1'
          JULIUS_REAL_POSTGRES: '1'
          JULIUS_SANDBOX_IMAGE: ${{ steps.images.outputs.sandbox }}
        run: |
          set -euo pipefail
          : "${JULIUS_TEST_DATABASE_URL:?the throwaway-database step exports it}"
          npx vitest run src/relay/persistence/real-infra-julius.test.ts --reporter=default --reporter=json --outputFile=/tmp/julius-real-infra.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("/tmp/julius-real-infra.json", "utf8"));
            const files = report.testResults.map((file) => file.name.replace(`${process.cwd()}/`, ""));
            const idle = report.numTodoTests + report.numPendingTests;
            console.log(`real-infrastructure suite: ${files.length} files, ${report.numPassedTests} passed, ${report.numFailedTests} failed, ${idle} todo/skipped`);
            for (const file of files) console.log(`  ${file}`);
            if (files.length !== 1) { console.error("real_infra_suite_missing: expected exactly real-infra-julius.test.ts"); process.exit(1); }
            if (idle > 0) { console.error(`real_infra_not_run: ${idle} case(s) did not run`); process.exit(1); }
          '
      - name: Cleanup
        if: always()
        run: |
          docker ps -aq --filter 'label=julius.sandbox' | xargs -r docker rm -f 2>/dev/null || true
          docker rm -f julius-real-infra-pg 2>/dev/null || true
  learning-store-container:
    # DECISION C (the C7 zero-spend dry run, finding G1): THE LEARNING STORE'S CONTAINER PATH, ON REAL DOCKER, ON EVERY
    # RELEVANT PR. A learning pair's two arms reach their PostgreSQL only through
    # `JULIUS_PG_CONTAINER=julius-postgres ./.github/julius-learning-store.sh` (arm WITHOUT's dump, arm WITH's restore),
    # that is `docker exec -i` into the container the arm starts. Before this job nothing ran that launcher against a
    # real daemon (scripts/julius-learning-store.test.ts pins its printed prefix; the real-PostgreSQL round trip runs the
    # host launcher), so its first real run would have been paid WITHOUT-1's dump, AFTER LIVE had spent, and a failure
    # there leaves WITH-1 nothing to restore.
    #
    # THE ARM'S OWN STEPS, read out of julius-first-live-mission.yml by their ids (learning_store, learning_store_scan,
    # learning_restore), run against a julius-postgres started with the arm's own lines, on a store whose schema the
    # repository's migrate() builds. Arm WITHOUT dumps and scans it; this job saves it as upload-artifact would (the
    # directory's contents, zipped); arm WITH's restore fetches it through a `gh` SHIM that answers only those reads,
    # from those zips. The restore must REFUSE the store while its WITHOUT bundle is unbound (its mode is not paid) and
    # RESTORE it once the bundle is paid and digest-bound; then the store script's own refusals must hold over the same
    # launcher. Every GitHub fact here is SYNTHETIC and says so; nothing here is evidence of a paid run.
    #
    # ZERO SPEND BY CONSTRUCTION: no `environment:`, no secret anywhere in this job, no token in any step's env, no
    # provider, no executor, no LIVE. Its only network is npm ci and the PostgreSQL image pull.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGUSER: julius
      PGDATABASE: julius
      # SYNTHETIC: the WITHOUT run this job plays, by a workflow run id no real run has, and its Julius run id.
      SYN_WITHOUT_RUN: '900000000001'
      SYN_WITHOUT_JULIUS_RUN: 'run:c10c10c10c10c10c10c10c10'
      SYN_WORKFLOW_ID: '999000001'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Create the ephemeral credentials, as the arm does
        id: identity
        run: ./.github/julius-live-identity.sh
      - name: Start PostgreSQL 16 as julius-postgres, with the arm's own lines
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          # THE ARM'S LINES, from .github/julius-live-executor.sh: its PostgreSQL half (the executor half is not the
          # store's, and is not started). Each is checked against that file first, so a drift fails here, not in a paid job.
          for line in \
            'pg_port=${JULIUS_LIVE_PG_PORT:-5432}' \
            'docker run -d --name julius-postgres -p "127.0.0.1:${pg_port}:5432" \' \
            '  -e POSTGRES_USER="$PGUSER" -e POSTGRES_PASSWORD="$PGPASSWORD" -e POSTGRES_DB="$PGDATABASE" postgres:16-bookworm' \
            'for _ in $(seq 1 40); do docker exec julius-postgres pg_isready -U "$PGUSER" && break; sleep 1; done'; do
            grep -qxF -- "$line" .github/julius-live-executor.sh || { echo "learning_store_container_launch_drift: $line" >&2; exit 1; }
          done
          pg_port=${JULIUS_LIVE_PG_PORT:-5432}
          case "$pg_port" in ''|*[!0-9]*) echo "pg_port_refused:$pg_port" >&2; exit 1 ;; esac
          docker run -d --name julius-postgres -p "127.0.0.1:${pg_port}:5432" \
            -e POSTGRES_USER="$PGUSER" -e POSTGRES_PASSWORD="$PGPASSWORD" -e POSTGRES_DB="$PGDATABASE" postgres:16-bookworm
          for _ in $(seq 1 40); do docker exec julius-postgres pg_isready -U "$PGUSER" && break; sleep 1; done
          # This job uses the server at once, so it waits for the FINAL one, over TCP (#316): the image's init server
          # answers on the socket only, just before it stops.
          for _ in $(seq 1 60); do docker exec julius-postgres pg_isready -h 127.0.0.1 -p 5432 -U "$PGUSER" -d "$PGDATABASE" >/dev/null 2>&1 && break; sleep 1; done
          docker exec julius-postgres pg_isready -h 127.0.0.1 -p 5432 -U "$PGUSER" -d "$PGDATABASE"
      - name: Read the arm's own store steps out of julius-first-live-mission.yml
        run: |
          set -euo pipefail
          for tool in jq unzip python3; do command -v "$tool" >/dev/null || { echo "learning_store_container_no_tool: $tool" >&2; exit 1; }; done
          steps="$RUNNER_TEMP/learning-arm-steps"
          mkdir -p "$steps"
          # The step with that id: its `run: |` body as GitHub hands it to bash. The block is every line indented by its
          # 10 spaces (or empty), less those spaces; it ends at the first line indented less.
          for id in learning_store learning_store_scan learning_restore; do
            node -e '
              const fs = require("node:fs");
              const [file, id, out] = process.argv.slice(1);
              const text = fs.readFileSync(file, "utf8");
              const marker = `\n        id: ${id}\n`;
              const at = text.indexOf(marker);
              if (at < 0 || text.indexOf(marker, at + 1) >= 0) { console.error(`learning_store_container_step_not_one: ${id}`); process.exit(1); }
              const start = text.lastIndexOf("\n      - ", at);
              const next = text.indexOf("\n      - ", at + 1);
              const step = text.slice(start, next < 0 ? text.length : next);
              const head = "\n        run: |\n";
              const body = step.indexOf(head);
              if (body < 0) { console.error(`learning_store_container_step_has_no_script: ${id}`); process.exit(1); }
              const kept = [];
              for (const line of step.slice(body + head.length).split("\n")) {
                if (line.trim() !== "" && !line.startsWith(" ".repeat(10))) break;
                kept.push(line.slice(10));
              }
              const script = kept.join("\n");
              // An expression in the body is for GitHub to substitute, and this job cannot. It is spelled in two parts
              // here, so that GitHub does not read this line as one.
              if (script.includes("$" + "{{")) { console.error(`learning_store_container_step_has_an_expression: ${id}`); process.exit(1); }
              fs.writeFileSync(out, `${script.trimEnd()}\n`);
            ' .github/workflows/julius-first-live-mission.yml "$id" "$steps/$id.sh"
          done
          # THIS JOB PROVES THE CONTAINER PATH ONLY WHILE THE ARM TAKES IT.
          grep -qF 'JULIUS_PG_CONTAINER=julius-postgres ./.github/julius-learning-store.sh dump ' "$steps/learning_store.sh"
          grep -qF 'JULIUS_PG_CONTAINER=julius-postgres ./.github/julius-learning-store.sh restore ' "$steps/learning_restore.sh"
          sha256sum "$steps"/*.sh
      - name: 'SYNTHETIC arm WITHOUT: a store the repository''s migrate() builds, one COMPLETED run, its WITHOUT record'
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          for db in julius_ls_without julius_ls_with julius_ls_foreign; do
            docker exec -e PGPASSWORD julius-postgres createdb -U "$PGUSER" "$db"
          done
          registration=$(printf '%s' 'SYNTHETIC julius-real-infra learning-store-container registration' | sha256sum | cut -d' ' -f1)
          echo "SYN_REGISTRATION=$registration" >> "$GITHUB_ENV"
          mkdir -p dist-relay-bridge
          cat > dist-relay-bridge/learning-store-container.ts <<'TS'
          // SYNTHETIC, for julius-real-infra.yml `learning-store-container` only; never evidence of a paid run.
          //   LS_MODE=without   arm WITHOUT's store: the repository's migrate() on a fresh database, one COMPLETED run, and
          //                     its WITHOUT record, written by recordJuliusLearningOutcome (the call the live entrypoint
          //                     makes at a registered arm's end). No adapter, no provider, no dispatch.
          //   LS_MODE=restored  what arm WITH's preflight does next on the restored store: migrateIfNeeded finds nothing
          //                     missing, and the store holds the WITHOUT run alone.
          import { createHash } from 'node:crypto';
          import { Pool } from 'pg';
          import { recordJuliusLearningOutcome } from '../relay-bridge/julius/live-composition';
          import { createJuliusPostgresRuntimeStore } from '../relay-bridge/julius/postgres-store';
          import { migrateIfNeeded } from '../scripts/julius-live-preflight-identity';

          const need = (name: string): string => {
            const value = process.env[name] ?? '';
            if (value === '') throw new Error(`learning_store_container_missing: ${name}`);
            return value;
          };

          async function main(): Promise<void> {
            const mode = need('LS_MODE');
            const runId = need('LS_RUN');
            const pool = new Pool({ connectionString: need('LS_DATABASE_URL') });
            try {
              const migrated = await migrateIfNeeded(pool);
              if (mode === 'without') {
                if (migrated.alreadyPresent !== 0) throw new Error(`learning_store_container_not_fresh: ${String(migrated.alreadyPresent)} present`);
                const projectId = 'prj-learning-store-container';
                const missionId = 'mission:learning-store-container';
                await pool.query('INSERT INTO relay_wonderland.projects(project_id) VALUES($1)', [projectId]);
                await pool.query("INSERT INTO relay_wonderland.mission_contracts(mission_id,project_id,stage,canonical_hash,snapshot) VALUES($1,$2,'READY',$1,'{}'::jsonb)", [missionId, projectId]);
                await pool.query(
                  'INSERT INTO relay_wonderland.julius_runs(run_id,mission_id,project_id,state,runtime_version,card_revision,mission_contract_revision,project_brain_revision,created_at)'
                  + " VALUES($1,$2,$3,'COMPLETED','julius-runtime.v1','card',1,0,now())", [runId, missionId, projectId]);
                const outcome = await recordJuliusLearningOutcome({
                  store: createJuliusPostgresRuntimeStore(pool), runId, projectId,
                  registration: { registrationDigest: need('LS_REGISTRATION'), arm: 'WITHOUT', policy: { dimensions: ['repairs'], minimumRelativeImprovement: 0.1, minimumImprovedDimensions: 1 } },
                  objectiveDigest: createHash('sha256').update('SYNTHETIC learning-store-container objective').digest('hex'),
                  roles: ['CODING_AGENT', 'INDEPENDENT_REVIEWER', 'PROMPT_ARCHITECT'],
                });
                if (outcome.record !== 'RECORDED') throw new Error(`learning_store_container_unrecorded: ${outcome.record}`);
                console.log(`SYNTHETIC arm WITHOUT store: migrations applied ${String(migrated.applied.length)}; ${runId} COMPLETED; its record ${outcome.record}`);
              } else if (mode === 'restored') {
                if (migrated.applied.length !== 0) throw new Error(`learning_store_container_restored_not_current: applied ${migrated.applied.join(',')}`);
                const runs = (await pool.query<{ run_id: string; state: string }>('SELECT run_id, state FROM relay_wonderland.julius_runs')).rows;
                if (runs.length !== 1 || runs[0]!.run_id !== runId || runs[0]!.state !== 'COMPLETED') throw new Error(`learning_store_container_restored_runs: ${JSON.stringify(runs)}`);
                console.log(`restored store: migrations already current (${String(migrated.alreadyPresent)} present); it holds ${runId} COMPLETED, alone`);
              } else {
                throw new Error(`learning_store_container_mode_unknown: ${mode}`);
              }
            } finally {
              await pool.end();
            }
          }

          main().catch((error: unknown) => { console.error(error instanceof Error ? error.message : String(error)); process.exit(1); });
          TS
          ./node_modules/.bin/esbuild dist-relay-bridge/learning-store-container.ts --bundle --platform=node --format=cjs \
            --outfile=dist-relay-bridge/learning-store-container.cjs --external:@anthropic-ai/claude-agent-sdk --external:pg --log-level=warning
          LS_PG_SCHEME=postgresql  # scheme kept out of the literal so the repository boundary scan does not read a URL with inline credentials
          LS_DATABASE_URL="${LS_PG_SCHEME}://$PGUSER:$PGPASSWORD@127.0.0.1:${JULIUS_LIVE_PG_PORT:-5432}/julius_ls_without" \
            LS_MODE=without LS_RUN="$SYN_WITHOUT_JULIUS_RUN" LS_REGISTRATION="$registration" node dist-relay-bridge/learning-store-container.cjs
      - name: 'Arm WITHOUT''s own dump and store scan, over the container launcher; the store saved as upload-artifact saves it'
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
          PGDATABASE: julius_ls_without
          EXECUTOR_ROOT: ${{ steps.identity.outputs.root }}
          SCOPED: ${{ steps.identity.outputs.scoped }}
          DB_PASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          steps="$RUNNER_TEMP/learning-arm-steps"
          arm="$RUNNER_TEMP/learning-arm-without"
          saved="$RUNNER_TEMP/learning-saved"
          rm -rf "$arm" "$saved"
          mkdir -p "$arm/.github" "$saved"
          # The arm runs the store script from its checkout: this one, byte for byte.
          cp .github/julius-learning-store.sh "$arm/.github/julius-learning-store.sh"
          cmp .github/julius-learning-store.sh "$arm/.github/julius-learning-store.sh"
          # SYNTHETIC: the one line of LIVE's log the dump step reads, naming this job's WITHOUT run.
          printf 'Run %s accepted in state READY; driving the Julius run loop.\n' "$SYN_WITHOUT_JULIUS_RUN" > "$arm/live-mission.log"
          ( cd "$arm" && GITHUB_RUN_ID="$SYN_WITHOUT_RUN" GITHUB_STEP_SUMMARY="$arm/summary.md" \
              bash --noprofile --norc -eo pipefail "$steps/learning_store.sh" ) > "$arm/dump.log" 2>&1 || { cat "$arm/dump.log"; exit 1; }
          cat "$arm/dump.log"
          grep -qx 'JULIUS_STORE_COMMAND container pg_dump --format=custom --compress=0 --no-password' "$arm/dump.log"
          grep -qx 'JULIUS_STORE_COMMAND container pg_restore --file=- --no-password' "$arm/dump.log"
          grep -qx "LEARNING_STORE_DUMPED julius_run_id=$SYN_WITHOUT_JULIUS_RUN dump_sha256=[0-9a-f]\{64\} dump_bytes=[0-9]*" "$arm/dump.log"
          # The scan's provider needles are empty: this job holds no provider credential.
          ( cd "$arm" && OPENAI_API_KEY='' ANTHROPIC_API_KEY='' CLAUDE_CODE_OAUTH_TOKEN='' XAI_API_KEY='' \
              bash --noprofile --norc -eo pipefail "$steps/learning_store_scan.sh" ) > "$arm/scan.log" 2>&1 || { cat "$arm/scan.log"; exit 1; }
          cat "$arm/scan.log"
          grep -qxF 'learning store scan clean (shapes and exact values, over the archive and its rendering)' "$arm/scan.log"
          # SAVED as upload-artifact saves a directory: its contents at the zip's root.
          ( cd "$arm/julius-learning-store" && python3 -m zipfile -c "$saved/julius-learning-store.zip" . )
          digest=$(sha256sum < "$arm/julius-learning-store/julius.pgdump" | cut -d' ' -f1)
          echo "SYN_DUMP_SHA256=$digest" >> "$GITHUB_ENV"
          echo "SYNTHETIC WITHOUT store saved: julius.pgdump sha256 $digest"
      - name: 'Arm WITH''s own restore, through a SYNTHETIC GitHub: refused while the WITHOUT bundle is unbound, restored once it is paid'
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -euo pipefail
          export LS_STEPS="$RUNNER_TEMP/learning-arm-steps" LS_SAVED="$RUNNER_TEMP/learning-saved" LS_SHIM="$RUNNER_TEMP/learning-gh-shim"
          rm -rf "$LS_SHIM"
          mkdir -p "$LS_SHIM/bin"
          : > "$LS_SHIM/calls.log"
          # SYNTHETIC GitHub: `gh` answers exactly the reads arm WITH's restore makes, from this job's files, and refuses
          # anything else (another endpoint, a field, an input, any method but GET). Real jq applies the step's filters.
          cat > "$LS_SHIM/bin/gh" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "$LS_SHIM/calls.log"
          [ "${1:-}" = api ] || { echo 'gh_shim_refused: only gh api' >&2; exit 2; }
          shift
          endpoint='' filter=''
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --jq) filter=$2; shift 2 ;;
              --method) [ "$2" = GET ] || { echo "gh_shim_refused: method $2" >&2; exit 2; }; shift 2 ;;
              -*) echo "gh_shim_refused: flag $1" >&2; exit 2 ;;
              *) [ -z "$endpoint" ] || { echo 'gh_shim_refused: two endpoints' >&2; exit 2; }; endpoint=$1; shift ;;
            esac
          done
          api="repos/$GITHUB_REPOSITORY/actions"
          case "$endpoint" in
            "$api/runs/$GITHUB_RUN_ID")
              body="{\"workflow_id\":$SYN_WORKFLOW_ID,\"head_sha\":\"$GITHUB_SHA\",\"event\":\"pull_request\",\"conclusion\":null}" ;;
            "$api/runs/$SYN_WITHOUT_RUN")
              body="{\"workflow_id\":$SYN_WORKFLOW_ID,\"head_sha\":\"$GITHUB_SHA\",\"event\":\"workflow_dispatch\",\"conclusion\":\"success\"}" ;;
            "$api/runs/$SYN_WITHOUT_RUN/artifacts?name=julius-learning-store&per_page=100")
              body='{"total_count":1,"artifacts":[{"id":9001,"name":"julius-learning-store","expired":false}]}' ;;
            "$api/runs/$SYN_WITHOUT_RUN/artifacts?name=julius-live-evidence&per_page=100")
              body='{"total_count":1,"artifacts":[{"id":9002,"name":"julius-live-evidence","expired":false}]}' ;;
            "$api/artifacts/9001/zip") cat "$LS_SAVED/julius-learning-store.zip"; exit 0 ;;
            "$api/artifacts/9002/zip") cat "$LS_SAVED/julius-live-evidence.zip"; exit 0 ;;
            *) echo "gh_shim_refused: not a read this job answers: $endpoint" >&2; exit 2 ;;
          esac
          if [ -n "$filter" ]; then printf '%s' "$body" | jq -r "$filter"; else printf '%s\n' "$body"; fi
          SHIM
          chmod +x "$LS_SHIM/bin/gh"
          # SYNTHETIC: arm WITHOUT's evidence bundle, as the restore reads it: the store record the dump step wrote, and
          # a bundle manifest naming the run in the given mode. Saved as upload-artifact would save it.
          evidence() {
            local mode=$1 dir="$RUNNER_TEMP/learning-evidence-$1"
            rm -rf "$dir"
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/learning-arm-without/julius-live-evidence/learning-store.txt" "$dir/learning-store.txt"
            echo 'SYNTHETIC: written by julius-real-infra learning-store-container. No paid run; no evidence of one.' > "$dir/SYNTHETIC.txt"
            printf '%s\n' 'manifest_version=1' "mode=$mode" "julius_run_id=$SYN_WITHOUT_JULIUS_RUN" "workflow_run_id=$SYN_WITHOUT_RUN" \
              'synthetic=julius-real-infra learning-store-container' > "$dir/bundle-manifest.txt"
            rm -f "$LS_SAVED/julius-live-evidence.zip"
            ( cd "$dir" && python3 -m zipfile -c "$LS_SAVED/julius-live-evidence.zip" . )
          }
          # One arm WITH job: a fresh directory holding the store script, the arm's restore step, its own log.
          restored=0
          restore_with() {
            local label=$1 database=$2 dir="$RUNNER_TEMP/learning-arm-with-$1"
            rm -rf "$dir"
            mkdir -p "$dir/.github"
            cp .github/julius-learning-store.sh "$dir/.github/julius-learning-store.sh"
            restored=0
            ( cd "$dir" && PATH="$LS_SHIM/bin:$PATH" PGDATABASE="$database" GITHUB_STEP_SUMMARY="$dir/summary.md" \
                WITHOUT_RUN="$SYN_WITHOUT_RUN" WITHOUT_JULIUS_RUN="$SYN_WITHOUT_JULIUS_RUN" REGISTRATION_DIGEST="$SYN_REGISTRATION" \
                bash --noprofile --norc -eo pipefail "$LS_STEPS/learning_restore.sh" ) > "$dir/restore.log" 2>&1 || restored=$?
            echo "--- arm WITH restore, case $label: exit $restored"
            cat "$dir/restore.log"
          }
          fail() { echo "learning_store_container_failed: $1" >&2; exit 1; }
          schemas() { docker exec -e PGPASSWORD julius-postgres psql -X -U "$PGUSER" -d "$1" -At -c "SELECT count(*) FROM information_schema.schemata WHERE schema_name = 'relay_wonderland'"; }

          # 1. UNBOUND. The WITHOUT bundle is not a paid one: the restore refuses it by the arm's rule, before the store
          #    script runs, and the target is left empty.
          evidence unknown
          restore_with unbound julius_ls_with
          log="$RUNNER_TEMP/learning-arm-with-unbound/restore.log"
          [ "$restored" != 0 ] || fail 'an unbound WITHOUT bundle was restored'
          grep -qF 'learning_store_without_bundle_unbound: the WITHOUT bundle does not name that paid run' "$log" || fail 'not refused as unbound'
          if grep -q '^JULIUS_STORE_COMMAND ' "$log"; then fail 'the store script ran for an unbound bundle'; fi
          [ "$(schemas julius_ls_with)" = 0 ] || fail 'the target is not empty after the refusal'

          # 2. BOUND. The same store, its bundle paid and naming the run: restored over the container launcher, whole.
          evidence paid
          restore_with bound julius_ls_with
          log="$RUNNER_TEMP/learning-arm-with-bound/restore.log"
          [ "$restored" = 0 ] || fail 'a paid, digest-bound WITHOUT store was not restored'
          grep -qx 'JULIUS_STORE_COMMAND container pg_restore --no-owner --no-privileges --single-transaction --exit-on-error --no-password --dbname=julius_ls_with' "$log" \
            || fail 'the restore did not run over the container launcher'
          grep -qxF "LEARNING_STORE_RESTORED without_workflow_run_id=$SYN_WITHOUT_RUN without_julius_run_id=$SYN_WITHOUT_JULIUS_RUN dump_sha256=$SYN_DUMP_SHA256" "$log" \
            || fail 'the restore did not name the store it restored'
          grep -qxF "dump_sha256=$SYN_DUMP_SHA256" "$RUNNER_TEMP/learning-arm-with-bound/julius-live-evidence/learning-restore.txt" || fail 'no restore record'
          # And what arm WITH's preflight does next on it: the migration finds it current, and it holds that run alone.
          LS_PG_SCHEME=postgresql  # scheme kept out of the literal so the repository boundary scan does not read a URL with inline credentials
          LS_DATABASE_URL="${LS_PG_SCHEME}://$PGUSER:$PGPASSWORD@127.0.0.1:${JULIUS_LIVE_PG_PORT:-5432}/julius_ls_with" \
            LS_MODE=restored LS_RUN="$SYN_WITHOUT_JULIUS_RUN" node dist-relay-bridge/learning-store-container.cjs

          # 3. THE STORE SCRIPT'S OWN REFUSAL, over the same launcher: the target now holds a run, so a second restore
          #    into it is refused by name, before pg_restore runs.
          restore_with occupied julius_ls_with
          log="$RUNNER_TEMP/learning-arm-with-occupied/restore.log"
          [ "$restored" != 0 ] || fail 'a restore into an occupied store passed'
          grep -qF "julius_store_target_not_empty: the target already holds relay_wonderland (runs: $SYN_WITHOUT_JULIUS_RUN)" "$log" || fail 'not refused as occupied'
          if grep -q '^JULIUS_STORE_COMMAND container pg_restore' "$log"; then fail 'pg_restore ran into an occupied store'; fi

          # 4. AND AFTER A RESTORE: a store recorded under another registration is restored, then refused by name.
          other=$(printf '%s' 'SYNTHETIC another registration' | sha256sum | cut -d' ' -f1)
          status=0
          PGDATABASE=julius_ls_foreign JULIUS_PG_CONTAINER=julius-postgres ./.github/julius-learning-store.sh restore \
            "$RUNNER_TEMP/learning-arm-without/julius-learning-store/julius.pgdump" "$SYN_WITHOUT_JULIUS_RUN" "$other" > "$RUNNER_TEMP/learning-foreign.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/learning-foreign.log"
          [ "$status" != 0 ] || fail 'a store of another registration passed'
          grep -qF 'LEARNING_STORE_RESTORING dump_sha256=' "$RUNNER_TEMP/learning-foreign.log" || fail 'the foreign store was not restored before its check'
          grep -qF 'learning_store_without_unrecorded: no WITHOUT record under this registration' "$RUNNER_TEMP/learning-foreign.log" || fail 'not refused as unrecorded'

          # THE SHIM SAW READS ONLY: this run, the WITHOUT run, its two artifact listings, its two zips; each a GET.
          echo '--- the SYNTHETIC GitHub reads'
          cat "$LS_SHIM/calls.log"
          [ -s "$LS_SHIM/calls.log" ] || fail 'the restore made no GitHub read'
          if grep -vqE '^api repos/[^ ]+/actions/(runs/[0-9]+|runs/[0-9]+/artifacts\?name=julius-(learning-store|live-evidence)&per_page=100|artifacts/900[12]/zip)( --method GET)?( --jq .+)?$' "$LS_SHIM/calls.log"; then
            fail 'a call other than the restore reads'
          fi
          echo 'LEARNING STORE CONTAINER PATH OK: dump, scan, save, refused unbound, restored bound, refused occupied, refused unrecorded.'
      - name: Cleanup
        if: always()
        run: |
          docker rm -f julius-postgres 2>/dev/null || true
          rm -rf "$RUNNER_TEMP"/learning-* "$RUNNER_TEMP/julius-learning-store-render" dist-relay-bridge/learning-store-container.* 2>/dev/null || true
