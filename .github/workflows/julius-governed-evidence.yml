# Read-only evidence for the reviewer before a checkpoint is signed.
# This file is not in the trusted computing base. Nothing here gates a landing,
# and the landing workflows never read its log. A change to this printer does
# not change what requireTrustedVerifier accepts.

name: Julius governed evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Print reviewer key, head, and rulesets
    if: ${{ !startsWith(github.ref, 'refs/heads/julius-governed-audit/') && !startsWith(github.head_ref, 'julius-governed-audit/') && !startsWith(github.base_ref, 'julius-governed-audit/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: julius-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Print the reviewer key, the head, and the live rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          JULIUS_REVIEWER_KEY_SHA256: ${{ vars.JULIUS_REVIEWER_KEY_SHA256 }}
        run: |
          set -euo pipefail
          echo "JULIUS_REVIEWER_KEY_SHA256=${JULIUS_REVIEWER_KEY_SHA256}"
          echo "head_sha=$(git rev-parse HEAD)"
          echo "head_tree=$(git rev-parse 'HEAD^{tree}')"
          echo "note: bypass_actors may be omitted for a non-admin token"
          echo "rulesets:"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" | tee "${RUNNER_TEMP}/rulesets.json"
          echo "ruleset_details:"
          jq -r 'if type == "array" then .[] | .id else empty end' "${RUNNER_TEMP}/rulesets.json" | while read -r id; do
            [ -n "$id" ] || continue
            echo "ruleset ${id}:"
            gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}"
          done
          echo "branch_rules_main:"
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main"
