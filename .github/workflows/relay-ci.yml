name: Relay CI

# Sunday Relay's own CI. It is independent of Sunday Alcatraz CI, it never
# deploys, and it never triggers an Alcatraz Railway or Vercel deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to an immutable commit SHA. A mutable tag can be repointed by
      # the action's owner (or by a compromised account) at any time, which
      # would change what CI executes without changing anything here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository boundary scan
        run: node scripts/relay-repository-boundary.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Website build
        run: npm run build

      # The production-bundle assertions in this file are gated on `dist/`
      # existing, so during `npm test` — which runs before any build — they
      # SKIP. Re-running them here, after the website build, is what actually
      # proves the shipped bundle carries no development labelling. Without
      # this step that guarantee would be a skipped test reported as green,
      # which is the shape this integration set out to remove.
      - name: Production entry (built bundle carries no development labelling)
        run: npx vitest run src/relay/ui/preview/production-entry.test.tsx

      - name: CLI build
        run: npm run relay:build

      # Companion to the production-entry step above. The documentation
      # contract asserts that the BUILT CLI actually runs and reports the
      # Relay product; that needs `dist-relay/cli.cjs`, which `npm test` runs
      # before producing. Re-running the file here is the only place the claim
      # can be proven. `scripts/ci-test-accounting.test.ts` fails if a
      # build-dependent test is ever added without a step like this one.
      - name: Documentation contract (built CLI actually runs)
        run: npx vitest run docs/documentation-contract.test.ts

      - name: Relay bridge build
        run: npm run relay:bridge:build

      # Parity is a REQUIREMENT, not an aspiration (governance §7). The
      # registry and the checker both live in this tree now, so these steps no
      # longer guard on their existence: a guard that skips when its own input
      # disappears is a check that can be switched off by deleting a file while
      # still reporting green. The gate below asserts registry and npm scripts
      # agree BEFORE running them, so "registry present + script missing" and
      # "script present + registry missing" fail loudly instead of skipping.
      - name: Website/CLI parity gate (registry and scripts must agree)
        run: node scripts/relay-parity-gate.mjs

      - name: Website/CLI parity
        run: npm run relay:surface-parity:check

      - name: Website/CLI parity (strict)
        run: npm run relay:surface-parity:check:strict

      - name: YC/demo product readiness
        run: npm run relay:yc-demo:check

      - name: CLI contract verification (offline, no provider call)
        run: npm run relay:cli:contract-verify
