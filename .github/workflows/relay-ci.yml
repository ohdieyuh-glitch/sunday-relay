name: Relay CI

# Sunday Relay's own CI. It is independent of Sunday Alcatraz CI, it never
# deploys, and it never triggers an Alcatraz Railway or Vercel deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository boundary scan
        run: node scripts/relay-repository-boundary.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Website build
        run: npm run build

      - name: CLI build
        run: npm run relay:build

      - name: Relay bridge build
        run: npm run relay:bridge:build

      # Parity is a REQUIREMENT, not an aspiration (governance §7). The
      # registry and the checker both live in this tree now, so these steps no
      # longer guard on their existence: a guard that skips when its own input
      # disappears is a check that can be switched off by deleting a file while
      # still reporting green. The gate below asserts registry and npm scripts
      # agree BEFORE running them, so "registry present + script missing" and
      # "script present + registry missing" fail loudly instead of skipping.
      - name: Website/CLI parity gate (registry and scripts must agree)
        run: node scripts/relay-parity-gate.mjs

      - name: Website/CLI parity
        run: npm run relay:surface-parity:check

      - name: Website/CLI parity (strict)
        run: npm run relay:surface-parity:check:strict

      - name: YC/demo product readiness
        run: npm run relay:yc-demo:check

      - name: CLI contract verification (offline, no provider call)
        run: npm run relay:cli:contract-verify
