name: Relay CI

# Sunday Relay's own CI. It is independent of Sunday Alcatraz CI, it never
# deploys, and it never triggers an Alcatraz Railway or Vercel deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to an immutable commit SHA. A mutable tag can be repointed by
      # the action's owner (or by a compromised account) at any time, which
      # would change what CI executes without changing anything here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository boundary scan
        run: node scripts/relay-repository-boundary.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Website build
        run: npm run build

      # The production-bundle assertions run in EVERY vitest run, including the
      # `npm test` above — nothing here is conditionally skipped. Without
      # `dist/` they assert that this workflow re-runs their file after the
      # website build; with `dist/` they assert against the real bundle. Only
      # this step supplies the second branch, so removing it does not turn a
      # test green, it turns the "no development labelling in the shipped
      # bundle" claim into a promise nothing ever checks.
      # `scripts/ci-test-accounting.test.ts` holds that ledger.
      - name: Production entry (built bundle carries no development labelling)
        run: npx vitest run src/relay/ui/preview/production-entry.test.tsx

      - name: CLI build
        run: npm run relay:build

      # Companion to the production-entry step above, and accounted for the
      # same way. The documentation contract asserts that the BUILT CLI
      # actually runs and reports the Relay product; that needs
      # `dist-relay/cli.cjs`, which `npm test` runs before producing, so in
      # that first run the assertion holds this workflow to re-running the
      # file here. This step is where the built CLI is actually executed.
      # `scripts/ci-test-accounting.test.ts` fails if a build-dependent test is
      # ever added without a step like this one, and it also asserts that each
      # re-run appears AFTER the build that produces its artifact.
      - name: Documentation contract (built CLI actually runs)
        run: npx vitest run docs/documentation-contract.test.ts

      - name: Relay bridge build
        run: npm run relay:bridge:build

      # The Hermes Reviewer service is the fourth build target, and Railway is
      # configured to run exactly this command. Without a step here a broken
      # service bundle would be discovered by a deploy rather than by CI —
      # which is the wrong place to learn that the artifact does not build.
      # It builds only; nothing here starts the service or contacts a provider.
      - name: Hermes Reviewer service build
        run: npm run relay:hermes:build

      # Signal handling can only be proven against a real process, so this file
      # needs the built entry point that `npm test` runs before producing. In
      # that first run its artifact-absent branch asserts this step exists;
      # here is where the handlers are actually signalled. Accounted for in
      # `scripts/ci-test-accounting.test.ts`.
      - name: Hermes service signal handling (built entry point, loopback only)
        run: npx vitest run relay-hermes-service/signal-lifecycle.test.ts

      # Parity is a REQUIREMENT, not an aspiration (governance §7). The
      # registry and the checker both live in this tree now, so these steps no
      # longer guard on their existence: a guard that skips when its own input
      # disappears is a check that can be switched off by deleting a file while
      # still reporting green. The gate below asserts registry and npm scripts
      # agree BEFORE running them, so "registry present + script missing" and
      # "script present + registry missing" fail loudly instead of skipping.
      - name: Website/CLI parity gate (registry and scripts must agree)
        run: node scripts/relay-parity-gate.mjs

      - name: Website/CLI parity
        run: npm run relay:surface-parity:check

      - name: Website/CLI parity (strict)
        run: npm run relay:surface-parity:check:strict

      - name: YC/demo product readiness
        run: npm run relay:yc-demo:check

      - name: CLI contract verification (offline, no provider call)
        run: npm run relay:cli:contract-verify
