name: Julius first live mission

# THE ONLY WORKFLOW IN THIS REPOSITORY THAT MAY SPEND PROVIDER MONEY.
#
# It runs one bounded, real Compound-AI mission end to end: GPT Prompt
# Architect -> Julius plan -> Claude Coding Agent -> Julius -> Independent
# Executor -> evidence -> Hermes/xAI Independent Reviewer -> Julius
# verification -> COMPLETE. Nothing about it is automatic.
#
# THREE INDEPENDENT GATES stand between a push and a paid run:
#   1. `workflow_dispatch` is the ONLY trigger. There is deliberately no
#      `push`, no `pull_request` and no `schedule`, so no commit and no clock
#      can start it.
#   2. the `confirm_live` input must be typed exactly, by a human, at dispatch.
#   3. the Julius entrypoint's own `--confirm-live` flag, which this workflow
#      passes only when gate 2 was satisfied. Approval is never inferred.
#
# The job additionally runs in the `julius-live-validation` GitHub Environment,
# so the provider credentials live beside neither ordinary CI nor the
# repository, and an environment reviewer can be required before it starts.
#
# PREFLIGHT ALWAYS RUNS AND SPENDS NOTHING. Dispatching with an empty
# `confirm_live` is the supported way to prove the whole rig — PostgreSQL,
# migrations, the independent executor, receipt attestation, scoped
# credentials, the sandbox ceiling, in-sandbox git, the Hermes profile, that
# all three roles resolve to the expected models, that each provider accepts
# its credential and serves the pinned model, and that the research the
# contract grants is reachable — without spending anything. The provider check
# reads model METADATA only (`GET /v1/models/<id>`), which generates no tokens
# and bills nothing; no completion is ever requested before the LIVE step.

# THE RUN'S TITLE IS A MACHINE-READABLE CLAIM, parsed by the paid-slot queue.
#
# `scripts/julius-paid-slot.mjs` orders every waiting paid run by the lane and
# key written here, and the dispatch client finds its own run by the key after
# an ambiguous network failure instead of dispatching a second one. The grammar
# is exact and whole-string on the reading side, so an input that tried to
# smuggle a second `mode=` into the title makes the run UNPARSEABLE — which the
# queue treats as waiting at the lowest priority, never as free.
run-name: "julius mission=${{ inputs.mission }} lane=${{ inputs.lane != '' && inputs.lane || 'unspecified' }} mode=${{ inputs.confirm_live == 'RUN LIVE MISSION' && 'paid' || 'preflight' }} key=${{ inputs.dispatch_key != '' && inputs.dispatch_key || 'none' }}"

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: 'Type "RUN LIVE MISSION" to dispatch the paid live mission. Leave empty for preflight only.'
        required: false
        default: ''
      acknowledge_rerun:
        description: 'Only to repeat a paid mission already attempted or completed, or to proceed when the marker state cannot be read. Type "RERUN PAID MISSION".'
        required: false
        default: ''
      max_ticks:
        description: 'Julius counts its tick allowance from the mission''s own structure. "derived" uses it; a whole number can only tighten it.'
        required: false
        default: 'derived'
      hermes_ref:
        description: 'Hermes Agent commit SHA (40 hex) to install for the Independent Reviewer. Immutable pins only.'
        required: false
        default: '2ea39daeb1f675d72e5c21c9400f2d58d7e6d71a'
      mission:
        description: 'Which bounded mission under .github/julius-missions/ to run. Its contract declares its own durable accounting namespace.'
        required: false
        default: 'julius-first-live'
      lane:
        description: 'Paid-run queue lane: qualification, qualification-repair, lab or regression. Required for a paid run and checked against the mission''s grant; may be empty for a preflight.'
        required: false
        default: ''
      subscription_smoke:
        description: 'Type "RUN SUBSCRIPTION SMOKE" to send ONE tiny `claude -p` request on the Coding Agent''s Claude subscription token (a trivial amount of subscription usage, never API credit). A paid run (confirm_live) always runs this smoke first and spends nothing unless it passes, so type this only for a smoke on its own; leave empty otherwise.'
        required: false
        default: ''
      dispatch_key:
        description: 'Idempotency key from scripts/julius-paid-dispatch.mjs ([A-Za-z0-9._@#-], 8-96). A second run carrying the same key refuses itself before it can spend.'
        required: false
        default: ''

# READ-ONLY, and every entry is here because a gate needs it. No write scope of
# any kind, no PAT, and never the coding worker's credential: the trust gates
# only ever ASK questions, and a token that could answer them differently is a
# token that could answer them wrongly.
#   contents       the branch tip, commit trees and parents, and `compare`
#   actions        the paid-attempt markers and the accepted-main checkpoints
#   pull-requests  the merged pull request behind the commit, and its reviews
#   issues         the pull request timeline, where a base retarget shows
#   statuses       the sha-bound attestation path
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  statuses: read

# EVERY RUN GETS A GROUP OF ITS OWN, and that is not a loosening.
#
# This used to put every LIVE run in one shared group. GitHub keeps exactly ONE
# pending run per concurrency group: a third paid dispatch silently CANCELLED
# the one already waiting, and the group had no notion of priority, so a lab
# experiment dispatched after the continuous qualification could evict it from
# the queue with nothing on the record but a grey "cancelled".
#
# Serialisation now belongs to the `paid-slot` job below, which waits for the
# one paid provider slot under an explicit rule (lane, then arrival, then run
# id), never cancels anything, and never lets a waiting run preempt an admitted
# one. The paid job keeps a job-level group of its own as a second line. Nothing
# is ever cancelled mid-flight: a live run holds a durable Julius run and real
# sandboxes, and killing it halfway leaves both to be reconciled by hand.
concurrency:
  group: julius-first-live-mission-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------- THE PAID PROVIDER SLOT
  #
  # ONE PAID RUN AT A TIME, IN AN ORDER SOMEBODY WROTE DOWN.
  #
  # Only a paid dispatch runs this job. It holds no secret, uses no environment
  # and can reach no provider: it proves the checkout the same way the paid job
  # does, checks the queue claim is well formed, and then waits in
  # `scripts/julius-paid-slot.mjs` until no other paid run holds the slot and
  # this run is first among the waiting under (lane, created at, run id). The
  # paid job `needs:` it, so nothing that can spend starts before admission.
  #
  # A qualification dispatched while a lab run is waiting goes ahead of it; one
  # dispatched while a lab run is already ADMITTED waits for it to finish.
  # Waiting runs are never cancelled, and a run carrying a dispatch key some
  # earlier run already carries refuses itself here without spending.
  #
  # The wait is bounded by this job's timeout, below GitHub's six-hour cap for a
  # hosted job; a run that cannot be admitted in that time says
  # `paid_slot_wait_exhausted` and has spent nothing.
  paid-slot:
    name: paid-slot
    if: inputs.confirm_live == 'RUN LIVE MISSION'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 'Make room for the trusted verifier, whatever the candidate shipped'
        run: rm -rf .julius-trusted-verifier

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f131098cc4e8f35d7231cf2e9693b83c05dab75c
          path: .julius-trusted-verifier
          persist-credentials: false

      # NO CACHE: nothing candidate-controlled is interpreted before trust exists.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # THE SAME GATE, FROM THE SAME PINNED VERIFIER, BEFORE THE QUEUE SCRIPT RUNS.
      # The admission script is repository content; it is read only after the
      # commit it came from is proven reviewed, current and not rolled back.
      - name: 'Gate: admission runs only reviewed, current, not rolled-back code'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git -C .julius-trusted-verifier rev-parse HEAD)"
          if [ "$actual" != 'f131098cc4e8f35d7231cf2e9693b83c05dab75c' ]; then
            echo "trusted_verifier_not_at_the_pinned_commit: $actual" >&2
            exit 1
          fi
          node .julius-trusted-verifier/scripts/julius-live-preflight-gates.mjs \
            "${GITHUB_REPOSITORY}" main "${GITHUB_REF}" "${GITHUB_SHA}"

      # A MALFORMED CLAIM MUST NOT WAIT SIX HOURS TO BE REFUSED. The paid job's
      # input gate checks all of this again, and the contract checker checks the
      # lane against the mission's grant; this is the cheap early version, so a
      # typo fails in seconds instead of occupying a runner in the queue.
      - name: 'Gate: the paid-run queue claim is well formed'
        env:
          LANE: ${{ inputs.lane }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          MISSION: ${{ inputs.mission }}
        run: |
          set -euo pipefail
          case "$LANE" in
            qualification|qualification-repair|lab|regression) ;;
            *) echo "paid_run_lane_invalid: '$LANE' (a paid run must claim qualification, qualification-repair, lab or regression)" >&2; exit 1;;
          esac
          case "$MISSION" in
            *[!a-z0-9-]*|'') echo "mission_not_a_slug: '$MISSION'" >&2; exit 1;;
          esac
          if [ -n "$DISPATCH_KEY" ] && ! printf '%s' "$DISPATCH_KEY" | grep -Eqx '[A-Za-z0-9._@#-]{8,96}'; then
            echo "dispatch_key_malformed" >&2
            exit 1
          fi
          [ -f ".github/julius-missions/$MISSION/contract.json" ] || {
            echo "mission_contract_missing: .github/julius-missions/$MISSION/contract.json" >&2; exit 1; }
          node scripts/julius-live-contract-check.mjs ".github/julius-missions/$MISSION/contract.json" --lane "$LANE"

      - name: 'Admission: wait for the paid provider slot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/julius-paid-slot.mjs wait --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

  first-live-mission:
    name: Preflight, then the live mission
    # ADMITTED, OR NOT PAID AT ALL. A dry run skips `paid-slot` and proceeds as it
    # always has; a paid run starts only when admission concluded `success`. A
    # paid run whose admission failed, was cancelled or refused a duplicate never
    # reaches a step that could spend.
    needs: paid-slot
    if: ${{ !cancelled() && (needs.paid-slot.result == 'success' || (needs.paid-slot.result == 'skipped' && inputs.confirm_live != 'RUN LIVE MISSION')) }}
    # THE SECOND LINE. With admission correct this group never has a pending
    # member; if admission were ever wrong, two paid jobs still could not run at
    # once. Dry runs keep a group of their own.
    concurrency:
      group: ${{ inputs.confirm_live == 'RUN LIVE MISSION' && 'julius-paid-provider-slot' || format('julius-preflight-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # THE JOB BUDGET IS SHARED OUT, not a taste. It is `JOB_BUDGET_MS` in
    # relay-bridge/reviewer-deadline.ts and a structural test fails if the two
    # disagree. 60 -> 90 when the reviewer deadline was derived (50 minutes: six
    # attempts at 480112 ms); 90 -> 120 when the coder got a derived share of its
    # own (30 minutes: two attempts at 734386 ms), because Paid Mission 5 spent
    # both the old 12-turn and 360000 ms ceilings with the work substantially
    # done. `coder-envelope.test.ts` proves the reviewer share, the coder share,
    # the architect's own ceiling and a stated infrastructure allowance all fit
    # inside this number.
    timeout-minutes: 120
    environment: julius-live-validation
    defaults:
      run:
        shell: bash
    env:
      JULIUS_CALLER_ID: julius-live
      JULIUS_TENANT_ID: tenant
      JULIUS_PROJECT_ID: prj-julius-first-live
      EXECUTOR_KEY_ID: julius-live-key
      JULIUS_FLEET_ROOT: /tmp/julius-workspace
      # THE WORK ARTIFACTS' ROOT, explicit (decision A): the mission stores each body here and the evidence dump copies
      # them from here, so the two never have to agree on a temp-directory guess. A literal path, like the roots above:
      # GitHub does not offer the `runner` context to a job-level env.
      JULIUS_WORK_ARTIFACT_ROOT: /tmp/julius-work-artifacts
      JULIUS_WORKSPACE: /tmp/julius-workspace/tenant/ws
      # THE RECEIPT TRANSPORT (PR #214, proven on real Docker). The executor asks the
      # host Docker daemon to bind-mount each sandbox's scoped receipt directory,
      # and the daemon resolves bind sources on the host; a receipt root inside the
      # executor container's own layer stopped every sandbox at prepareWorkspace
      # (sandbox_create_failed class=bind_source_missing). The root therefore lives
      # on the host — created root:root 0700 by the launcher, mounted into the
      # executor at this same path, unreadable by the runner user — while the
      # signing key and the ledger stay under /executor-private, never mounted.
      JULIUS_RECEIPT_HOST_ROOT: /tmp/julius-executor/receipts
      JULIUS_PUBLIC_KEY_PATH: /tmp/julius-public.pem
      JULIUS_EXECUTOR_ENDPOINT: http://127.0.0.1:8787/
      JULIUS_EXECUTOR_ALLOW_LOOPBACK: '1'
      PGUSER: julius
      PGDATABASE: julius
      HERMES_PROFILE_HOME: /tmp/julius-hermes-home
      HERMES_WRAPPER_DIR: /tmp/julius-hermes-bin
      # DERIVED, NOT PINNED. Each mission owns a directory holding its contract
      # and its workspace seed; the generic runner is the same for all of them.
      MISSION_DIR: .github/julius-missions/${{ inputs.mission }}
      CONTRACT: .github/julius-missions/${{ inputs.mission }}/contract.json
      # The three roles, pinned. The preflight refuses if the entrypoint
      # resolves anything other than these.
      RELAY_PROMPT_ARCHITECT_MODE: live
      OPENAI_PROMPT_ARCHITECT_MODEL: gpt-5.6-sol
      # THE CODING AGENT IS CLAUDE OPUS 5.5 (founder decision, 2026-09-30), on the
      # founder's Claude Max subscription. The smoke and the paid run use this one pin,
      # so the model a smoke qualifies is the model the paid run uses. No other model
      # is acceptable, and none is a fallback: the smoke's verdict and the coder's
      # dispatch must refuse any other SERVED model, and a paid run needs both.
      RELAY_HOSTED_CODING_MODEL: claude-opus-5-5
      RELAY_HERMES_PROVIDER: xai
      RELAY_HERMES_MODEL: grok-build-0.1
      # HOW THE REVIEWER IS PAID FOR, declared by the operator who knows: the Hermes step
      # writes the xAI API key into the reviewer's profile, so every review is billed to that
      # key. Julius records it as the reviewer's billingPath, API_BILLED; undeclared, the
      # owner could only be told UNKNOWN for a role whose money is real.
      RELAY_HERMES_BILLING_MODE: api_billed
      # TWO DEADLINES, IN THIS ORDER, and the order is the point.
      #
      # Paid run 34311556047's reviewer failed three times on `review:plan` at
      # exactly 180 s each with zero bytes and no exit code, because Relay's
      # window was the ONLY deadline: the engine had none configured and
      # inherited its SDK default of 600 s with three retries, so Relay's cut
      # always came first and every distinct provider fault reached the record
      # as one indistinguishable shape. The reviewer engine now gets a deadline
      # of its own, well inside Relay's, so it fails first and says why; the
      # bootstrap refuses if these two are ever put back in the wrong order.
      #
      # 90 s is a whole provider request for one review, which the control run
      # 34306850331 finished in far less — and if a review really needs more,
      # the engine now says so and the failure is retryable, with three
      # attempts.
      #
      # RELAY'S OWN BACKSTOP IS NO LONGER SET HERE. It was `400000`, chosen as
      # `timeout-minutes: 60` divided by six reviewer attempts, and guarded
      # against a modelled engine worst case of 360000 ms. Paid Mission 4's
      # `review:plan` was cut off at 400093 ms and then SUCCEEDED at 381880 ms,
      # so the model was optimistic by 21.9 s and the literal it was compared
      # against was the tightest the job would allow. A literal here also meant
      # the live composition's reviewer worker could declare a different number
      # — it declared 240000, which nothing enforced.
      #
      # `scripts/julius-reviewer-deadline.mjs` now derives the window from the
      # analytical model, the durations paid runs were actually observed to
      # reach, an explicit headroom, and a ceiling owed to the job; the Hermes
      # bootstrap exports the result and the bridge derives the identical value
      # for both the transport and the declared worker deadline.
      #
      # Waiting longer buys no tokens — the provider bills for what it
      # generates whether or not Relay is still reading — and the attempt
      # ceiling is untouched, so this changes how long a failure takes to
      # become legible, not what a run may spend.
      #
      # 90 -> 480 AFTER PAID QUALIFICATION 34753589938. The reviewer now holds no
      # tool, so a review is ONE request that must reason and then write the
      # whole JSON verdict — not a loop of short tool calls, which is what 90 s
      # was sized against. That run's first attempt hit this cap and its re-ask
      # was killed by the engine's 12 s stream-idle watchdog while the model
      # reasoned in silence. 480 is the longest review ever watched (400 s, cut
      # off still running) plus a fifth, so one request may last as long as a
      # whole review has. The bootstrap ties both codex watchdogs to this same
      # number, and the reviewer deadline is re-derived from it (792 000 ms,
      # unchanged).
      HERMES_REQUEST_TIMEOUT_SECONDS: '480'

    steps:
      # Pinned to immutable commit SHAs. A mutable tag can be repointed by the
      # action's owner at any time, which would change what runs here without
      # changing anything in this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after checkout authenticates to git, and $GITHUB_WORKSPACE
          # is bind-mounted into the executor container — a persisted token in
          # .git/config would ride along with it.
          persist-credentials: false

      # THE VERIFIER MUST NOT COME FROM THE COMMIT IT IS JUDGING.
      #
      # A candidate running its own trust gate to decide whether it is
      # trustworthy is a formality: alter the gate in the same push and it
      # returns success. So the gate is executed from a SECOND checkout pinned
      # to an immutable commit that was already accepted as a checkpoint, while
      # it evaluates whatever `main` currently is.
      #
      # This sha is a TRUST ROOT and is deliberately hard to change: it may only
      # move through the founder-controlled workflow-administration ceremony,
      # because the coding worker cannot write this file at all.
      # THE CANDIDATE DOES NOT GET TO OWN THE PATH THE VERIFIER LANDS ON.
      #
      # The candidate tree is already on disk by now, so it could ship a file, a
      # directory or a symlink at this path. `actions/checkout` would clean the
      # destination anyway, but a symlink makes "the destination" a question
      # about candidate content, and this gate exists precisely so that nothing
      # about it is. One line removes the whole class.
      - name: 'Make room for the trusted verifier, whatever the candidate shipped'
        run: rm -rf .julius-trusted-verifier

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f131098cc4e8f35d7231cf2e9693b83c05dab75c
          path: .julius-trusted-verifier
          persist-credentials: false

      # NO CACHE, ON PURPOSE. `cache: npm` reads the candidate's lockfile, and
      # nothing candidate-controlled may be interpreted before trust exists.
      # The cached setup that the build needs happens after the gate passes.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # ------------------------------------------------- REPOSITORY TRUST GATE
      #
      # THIS RUNS ON EVERY DISPATCH, dry or paid. A dry run spends no provider
      # money, but it executes the credentialed rig inside the
      # `julius-live-validation` environment, so an unprovenanced or rolled-back
      # checkout must not reach it merely because `confirm_live` was left empty.
      #
      # Everything the gate needs is passed explicitly. It reads `main`
      # remotely, freezes it, and requires: the branch is exactly `main`, the
      # ref is exactly `refs/heads/main`, THIS JOB'S OWN COMMIT is that frozen
      # tip, reviewed-main provenance says `provenant` for it, main
      # monotonicity says `monotonic` for that same frozen commit, and `main`
      # has not moved by the time both have answered. Anything unreadable,
      # contradictory or moving fails closed.
      #
      # PRECONDITION, and the one that will surprise someone: monotonicity needs
      # a non-expired `julius-accepted-main-<sha>` checkpoint to exist at all.
      # Checkpoints are artifacts and expire after 90 days, so `Julius accept
      # main` must be dispatched at the current `main` at least every 60 days or
      # every dispatch here — dry runs included — blocks with `uninitialized`.
      # That is the correct failure, and the cadence is docs/REPOSITORY_GOVERNANCE.md §13.5.
      - name: 'Gate: the code this job will run is reviewed, current and not rolled back'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE TRUST ROOT IS PROVEN, NOT ASSUMED. The step above proves where
          # the verifier landed; this proves WHAT landed there. Without it, "the
          # verifier is the pinned commit" is a property of `actions/checkout`'s
          # internals rather than a checked fact of this run, and the whole
          # arrangement rests on that one sentence being true.
          actual="$(git -C .julius-trusted-verifier rev-parse HEAD)"
          if [ "$actual" != 'f131098cc4e8f35d7231cf2e9693b83c05dab75c' ]; then
            echo "trusted_verifier_not_at_the_pinned_commit: $actual" >&2
            exit 1
          fi
          node .julius-trusted-verifier/scripts/julius-live-preflight-gates.mjs \
            "${GITHUB_REPOSITORY}" main "${GITHUB_REF}" "${GITHUB_SHA}"

      # Only now, with the candidate proven, is its own content read.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: 'Gate: the dispatch inputs are well formed'
        id: inputs_gate
        env:
          MAX_TICKS: ${{ inputs.max_ticks }}
          CONFIRM_LIVE: ${{ inputs.confirm_live }}
          HERMES_REF: ${{ inputs.hermes_ref }}
          MISSION: ${{ inputs.mission }}
          LANE: ${{ inputs.lane }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          set -euo pipefail
          # THE QUEUE CLAIM, AGAIN. `paid-slot` already refused a malformed one,
          # but a dry run never runs `paid-slot`, and this gate must not depend on
          # another job having run. A paid run must claim a lane; a dry run may
          # leave it empty. The lane is checked against the mission's GRANT by the
          # contract check below. Absent reads as empty, the way a dry run with no
          # lane arrives.
          LANE="${LANE:-}"
          DISPATCH_KEY="${DISPATCH_KEY:-}"
          if [ "$CONFIRM_LIVE" = 'RUN LIVE MISSION' ] && [ -z "$LANE" ]; then
            echo "paid_run_lane_missing: a paid run must claim a lane" >&2; exit 1
          fi
          case "$LANE" in
            ''|qualification|qualification-repair|lab|regression) ;;
            *) echo "paid_run_lane_invalid: '$LANE'" >&2; exit 1;;
          esac
          if [ -n "$DISPATCH_KEY" ] && ! printf '%s' "$DISPATCH_KEY" | grep -Eqx '[A-Za-z0-9._@#-]{8,96}'; then
            echo "dispatch_key_malformed" >&2; exit 1
          fi
          # Runs FIRST, before any build, container or credential exists, so a
          # malformed dispatch costs nothing and cannot reach a provider.
          #
          # THE ALLOWANCE IS JULIUS'S TO COUNT. The entrypoint derives it from the
          # mission's own structure (planJuliusTickBudget: units, repair rounds,
          # segment ceiling, guidance and review obligations), prints it before
          # the first dispatch, and fails the run with the numbers if it is ever
          # exhausted. The ceiling used to be a fixed 32, sized for a
          # six-task graph; qualification attempt 4 (run 34774471909) hit it at
          # 44 of 120 minutes with the run still inside every contract bound.
          # This input can only TIGHTEN that allowance (the drive takes the
          # smaller), so it needs no upper bound here. The floor stays: below
          # eight ticks even the smallest mission is paid for and then cut off.
          MIN_TICKS=8
          case "$MAX_TICKS" in
            derived) ;;
            ''|*[!0-9]*|0*)
              echo "max_ticks_not_an_integer: '$MAX_TICKS' is neither \"derived\" nor a whole number" >&2; exit 1;;
            *)
              if [ "${#MAX_TICKS}" -gt 6 ] || [ "$MAX_TICKS" -lt "$MIN_TICKS" ]; then
                echo "max_ticks_out_of_range: $MAX_TICKS is below $MIN_TICKS or not a tick count" >&2
                exit 1
              fi;;
          esac
          # WHEN THE WALL CLOCK STARTED, for the deadline the live entrypoint
          # prints. Taken here, seconds after the job began, so the printed
          # deadline is that much later than the runner's real one. A step
          # output, read by name in the live step, never a job-wide variable.
          echo "job_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # `confirm_live` is compared for exact equality by the live step's
          # `if:`; anything else is a dry run. Saying so here makes a typo
          # visible instead of silently producing a free run the operator
          # believed was paid.
          if [ -n "$CONFIRM_LIVE" ] && [ "$CONFIRM_LIVE" != 'RUN LIVE MISSION' ]; then
            echo "confirm_live_not_recognised: refusing rather than silently running a dry run" >&2
            exit 1
          fi
          # Hermes renders the Independent Reviewer's verdict, so it is pinned
          # the same way every GitHub Action here is: to an immutable commit. A
          # tag can be repointed by its owner, which would change what decides
          # a paid mission without changing anything in this repository.
          case "$HERMES_REF" in
            *[!0-9a-f]*|'') echo "hermes_ref_not_a_commit_sha: '$HERMES_REF'" >&2; exit 1;;
          esac
          if [ "${#HERMES_REF}" -ne 40 ]; then
            echo "hermes_ref_not_a_commit_sha: expected 40 hex characters, got ${#HERMES_REF}" >&2
            exit 1
          fi
          # THE MISSION NAME IS A PATH SEGMENT. Anything but a bounded slug could
          # escape `.github/julius-missions/`, so it is refused rather than
          # sanitised — and the directory must actually exist, because a missing
          # contract would otherwise surface much later as a confusing parse
          # failure after the rig had already been built.
          case "$MISSION" in
            *[!a-z0-9-]*|'') echo "mission_not_a_slug: '$MISSION'" >&2; exit 1;;
          esac
          [ -f ".github/julius-missions/$MISSION/contract.json" ] || {
            echo "mission_contract_missing: .github/julius-missions/$MISSION/contract.json" >&2; exit 1; }
          # A MISSION MUST DECLARE EXACTLY ONE SEED. `workspace/` is a throwaway
          # tree the mission invented; `slice.txt` names paths of THIS repository
          # to copy byte-for-byte, for a mission whose subject is Sunday Relay
          # itself. Neither is a fallback for the other, and a mission declaring
          # both would leave nothing able to say what the coder was editing —
          # so both cases are refused here, before the rig is built.
          seed_dir=".github/julius-missions/$MISSION/workspace"
          seed_slice=".github/julius-missions/$MISSION/slice.txt"
          if [ -d "$seed_dir" ] && [ -f "$seed_slice" ]; then
            echo "mission_seed_ambiguous: $MISSION declares both workspace/ and slice.txt" >&2; exit 1; fi
          [ -d "$seed_dir" ] || [ -f "$seed_slice" ] || {
            echo "mission_workspace_seed_missing: neither $seed_dir nor $seed_slice" >&2; exit 1; }

          # THE ACCOUNTING NAMESPACE IS THE CONTRACT'S, read from the contract
          # rather than assumed from the directory name: the marker artifacts a
          # paid dispatch counts are the ones this mission declares, so two
          # contracts can never answer for each other's paid history.
          namespace=$(node -e 'const c=require("./"+process.argv[1]);const n=c.markerNamespace;if(typeof n!=="string"||!/^[a-z][a-z0-9-]{2,48}$/.test(n)){console.error("marker_namespace_invalid");process.exit(1)}process.stdout.write(n)' "$CONTRACT")
          [ -n "$namespace" ] || { echo 'marker_namespace_unreadable' >&2; exit 1; }
          echo "marker_namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "inputs OK: mission=$MISSION namespace=$namespace max_ticks=$MAX_TICKS hermes_ref=$HERMES_REF mode=$([ "$CONFIRM_LIVE" = 'RUN LIVE MISSION' ] && echo LIVE || echo DRY-RUN)"

      - name: 'Gate: no paid mission has been attempted or completed for THIS contract'
        if: inputs.confirm_live == 'RUN LIVE MISSION'
        env:
          GH_TOKEN: ${{ github.token }}
          ACKNOWLEDGE_RERUN: ${{ inputs.acknowledge_rerun }}
          MARKER_NAMESPACE: ${{ steps.inputs_gate.outputs.marker_namespace }}
        run: |
          set -euo pipefail
          # Julius's own idempotency key is derived from the contract digest and
          # deduplicates against the durable store — but this rig creates and
          # destroys its PostgreSQL per job, so every dispatch meets an empty
          # database and that key protects nothing across dispatches. The
          # durable fact therefore has to live somewhere GitHub keeps: this
          # workflow's own artifacts. TWO markers, and the distinction is the
          # whole point:
          #
          #   julius-first-live-attempted — written after every free gate has
          #     passed and BEFORE the provider-capable entrypoint is invoked.
          #     It means A PAID RUN WAS AUTHORIZED AND ENTERED, which is the
          #     honest claim: whether a provider was actually billed is not
          #     knowable from here, and treating "no bill proven" as "no
          #     attempt" is what let attempt #1 be followed by an ordinary
          #     dispatch.
          #   julius-first-live-completed — written only when Julius itself
          #     reached legitimate completion.
          #
          # A FAILED PAID RUN LEAVES THE ATTEMPT MARKER BEHIND, so the next
          # paid dispatch needs the typed acknowledgement even though nothing
          # ever completed. That is the repair the first paid attempt asked
          # for.
          #
          # KNOWN LIMIT, stated rather than papered over: artifacts expire (90
          # days here) and can be deleted, so this guard weakens with age. It is
          # a guard against ACCIDENT — a second dispatch of a run that already
          # succeeded — not a security control, and it sits behind the typed
          # phrase and the environment's own approval.
          # Unknown is not zero. "The marker list could not be read" and "no
          # marker exists" must never share an answer: the first is exactly the
          # state in which an accidental second paid run slips through.
          count_markers() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | length'
          }
          is_count() { case "$1" in ''|*[!0-9]*) return 1;; *) return 0;; esac; }
          # THE GUARD MUST COVER THE ATTEMPT THAT MOTIVATED IT.
          #
          # Run 33697109210 crossed the live boundary on 2026-09-02, failed at
          # its `plan` task, and left no marker because the attempt marker did
          # not exist yet. A guard that counted only artifacts would therefore
          # let the very next paid dispatch through with no acknowledgement —
          # the exact accident this repair was written to stop, on the exact run
          # that revealed it. So the attempt is recorded here, in the workflow,
          # where it also outlives the 90-day artifact expiry.
          #
          # THIS NUMBER ONLY EVER GOES UP. Increment it when another paid run
          # is entered that this file does not already count; never reduce it.
          # An earlier version of this comment said to set it to 0 once markers
          # existed — which would have handed the gap back on a 90-day fuse,
          # because markers carry `retention-days: 90` and `count_markers`
          # ignores expired ones. One case in
          # scripts/julius-first-live-mission.test.ts pins both the value and
          # the run it names, so a change here is a change there too.
          # PER NAMESPACE, because a recorded attempt is a fact about ONE
          # contract. The first live mission entered LIVE on run 33697109210
          # before the attempt marker existed, so that history lives here and
          # nowhere else; a mission this table does not name has no recorded
          # prior attempt, and its artifact markers are the whole of its
          # accounting. Only ever increase a number here.
          case "$MARKER_NAMESPACE" in
            julius-first-live) RECORDED_PAID_ATTEMPTS=1 ;;  # run 33697109210
            *)                 RECORDED_PAID_ATTEMPTS=0 ;;
          esac
          # The one hand-maintained value in this gate was also the only one
          # that failed OPEN when malformed — an empty or non-numeric value made
          # the comparison error, fall through to the else, and announce a first
          # paid mission. It is held to the same digit test as the counts.
          is_count "$RECORDED_PAID_ATTEMPTS" || {
            echo "recorded_paid_attempts_not_a_count: '$RECORDED_PAID_ATTEMPTS'" >&2
            exit 1
          }
          # Either list failing means the previous-run state is UNKNOWN, and
          # unknown is never treated as zero.
          if ! completed=$(count_markers "${MARKER_NAMESPACE}-completed") || ! attempted=$(count_markers "${MARKER_NAMESPACE}-attempted"); then
            echo 'julius_first_live_marker_unknown: the marker list could not be read.' >&2
            if [ "$ACKNOWLEDGE_RERUN" != 'RERUN PAID MISSION' ]; then
              echo 'Refusing to pay while the previous-run state is unknown. Re-dispatch with' >&2
              echo 'acknowledge_rerun = "RERUN PAID MISSION" to proceed anyway.' >&2
              exit 1
            fi
            echo 'operator acknowledged proceeding despite the UNKNOWN marker state'
          # A LIST THAT ANSWERED, BUT NOT WITH A NUMBER, IS STILL UNKNOWN.
          # `${x:-0}` is a default-to-zero, and zero is the one answer that lets
          # a second paid run through. Anything that is not a count is routed to
          # the same refusal an unreadable list gets, using the digit test this
          # workflow already applies to max_ticks and hermes_ref. EACH VALUE IS
          # TESTED ON ITS OWN: concatenating them lets an empty answer hide
          # behind the other's digits, which is how this check first passed a
          # blank count as zero.
          elif ! is_count "$completed" || ! is_count "$attempted"; then
            echo 'julius_first_live_marker_unknown: the marker list did not answer with a count.' >&2
            if [ "$ACKNOWLEDGE_RERUN" != 'RERUN PAID MISSION' ]; then
              echo 'Refusing to pay while the previous-run state is unknown. Re-dispatch with' >&2
              echo 'acknowledge_rerun = "RERUN PAID MISSION" to proceed anyway.' >&2
              exit 1
            fi
            echo 'operator acknowledged proceeding despite an UNPARSEABLE marker count'
          elif [ "$completed" -gt 0 ] || [ "$attempted" -gt 0 ] || [ "$RECORDED_PAID_ATTEMPTS" -gt 0 ]; then
            if [ "$ACKNOWLEDGE_RERUN" != 'RERUN PAID MISSION' ]; then
              echo "julius_paid_mission_already_entered_for_${MARKER_NAMESPACE}: $completed completion marker(s), $attempted attempt marker(s) and $RECORDED_PAID_ATTEMPTS recorded prior attempt(s)." >&2
              echo 'A paid first-live mission has already been entered — a previous attempt may have' >&2
              echo 'spent provider money whether or not it completed. Re-dispatch with' >&2
              echo 'acknowledge_rerun = "RERUN PAID MISSION" only if you intend to pay again.' >&2
              exit 1
            fi
            echo "operator acknowledged a deliberate rerun over $completed completion marker(s), $attempted attempt marker(s) and $RECORDED_PAID_ATTEMPTS recorded prior attempt(s)"
          else
            echo 'no completion or attempt marker found; this would be the first paid mission'
          fi

      - name: Install
        run: npm ci

      # THE SUBSCRIPTION SMOKE — ON ITS OWN WHEN ASKED, BEFORE EVERY PAID RUN, AND NEVER API CREDIT.
      #
      # A PAID RUN QUALIFIES ITS CODER FIRST (Codex review of #302, P1). The readiness
      # check below proves a LOGIN, not that the pinned model is served: a paid run
      # that skipped this step could pay the Prompt Architect and the plan review
      # before learning the coder's model was unavailable or substituted. So
      # `confirm_live` runs this step too, and the attempt marker, its upload and the
      # LIVE step each require its `success` by id. The zero-dispatch preflight (no
      # `confirm_live`, no `subscription_smoke`) still sends nothing.
      #
      # The Coding Agent authenticates with the founder's Claude Max subscription
      # through a `claude setup-token` token (CLAUDE_CODE_OAUTH_TOKEN). The free
      # readiness check below proves the PATH (`auth status` in the child's own
      # environment); only a real request proves the token is live and the pinned
      # model is served on the subscription. This sends exactly one: "Reply with
      # exactly OK", one turn, in an empty temporary directory (no project
      # settings, no CLAUDE.md), with the Agent SDK's own bundled CLI for this
      # runner (ubuntu x64) run as a LITERAL command under `env -i`: its
      # environment is built from nothing but PATH, a fresh HOME, CI/NO_COLOR/TERM,
      # the token and the CLI's two small-model slots pinned to the Coding Agent's
      # own model, so no Anthropic API variable can reach it and no other model can
      # answer: a housekeeping call the CLI makes lands on the pinned model too, and
      # the smoke's served-model check may then require that EVERY model that
      # produced output is the one asked for. No Anthropic API
      # key exists in this step either, and `env-check` refuses outright if any
      # variable that outranks the token is present. The CLI's output goes to
      # files the check script judges; stderr is discarded; only closed tokens
      # are printed. There is no fallback: anything but a subscription is FAIL.
      - name: 'Subscription smoke: one tiny request on the Coding Agent''s subscription'
        id: subscription_smoke
        if: success() && (inputs.subscription_smoke == 'RUN SUBSCRIPTION SMOKE' || inputs.confirm_live == 'RUN LIVE MISSION')
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          # THE STEP ALWAYS REACHES ITS VERDICT. GitHub runs this under `bash -e`, which
          # `set -uo pipefail` does not clear, so a CLI that exited non-zero (as it does
          # on an error reply) aborted the step before smoke-verdict read its JSON; with
          # stderr discarded, run 36685079176 failed and left no reason behind. Errexit
          # is off for this step only. Every outcome below is still decided explicitly,
          # and the step still fails closed: only a PASS verdict line lets it succeed.
          # BOTH EXITS DECIDE TOO (Codex review of #302, P2): each is kept in a variable on
          # the line straight after its call, handed to smoke-verdict, and required to be
          # 0 below, so JSON that reads OK from a CLI that then exited non-zero is a FAIL.
          set +e
          sub=$(mktemp -d)
          mkdir "$sub/home" "$sub/work"
          : > subscription-smoke.log
          status=1
          auth_exit=none
          cli_exit=none
          if node scripts/julius-subscription-check.mjs env-check --for smoke --model "$RELAY_HOSTED_CODING_MODEL" | tee -a subscription-smoke.log; then
            env -i -C "$sub/work" PATH="$PATH" HOME="$sub/home" CI=1 NO_COLOR=1 TERM=dumb ANTHROPIC_DEFAULT_HAIKU_MODEL="$RELAY_HOSTED_CODING_MODEL" ANTHROPIC_SMALL_FAST_MODEL="$RELAY_HOSTED_CODING_MODEL" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
              "$PWD/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" auth status --json > "$sub/status.json" 2>/dev/null
            auth_exit=$?
            echo "subscription_smoke_auth_exit=$auth_exit" | tee -a subscription-smoke.log
            if node scripts/julius-subscription-check.mjs status-verdict --for smoke --model "$RELAY_HOSTED_CODING_MODEL" < "$sub/status.json" | tee -a subscription-smoke.log; then
              env -i -C "$sub/work" PATH="$PATH" HOME="$sub/home" CI=1 NO_COLOR=1 TERM=dumb ANTHROPIC_DEFAULT_HAIKU_MODEL="$RELAY_HOSTED_CODING_MODEL" ANTHROPIC_SMALL_FAST_MODEL="$RELAY_HOSTED_CODING_MODEL" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
                "$PWD/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" -p 'Reply with exactly OK' --max-turns 1 --output-format json --model "$RELAY_HOSTED_CODING_MODEL" --setting-sources user --strict-mcp-config --no-session-persistence > "$sub/smoke.json" 2>/dev/null
              cli_exit=$?
              echo "subscription_smoke_cli_exit=$cli_exit" | tee -a subscription-smoke.log
              node scripts/julius-subscription-check.mjs smoke-verdict --model "$RELAY_HOSTED_CODING_MODEL" --status-file "$sub/status.json" --auth-exit "$auth_exit" --cli-exit "$cli_exit" < "$sub/smoke.json" | tee -a subscription-smoke.log
              status=${PIPESTATUS[0]}
            fi
          fi
          rm -rf "$sub"
          grep -qE '^subscription_smoke provider=anthropic .* auth=CLAUDE_SUBSCRIPTION method=(oauth_token|claude\.ai) reply=OK result=PASS$' subscription-smoke.log \
            || { echo 'subscription_smoke_failed: no PASS on the pinned model; the log above says why; nothing else was attempted' >&2; exit 1; }
          [ "$auth_exit" = 0 ] && [ "$cli_exit" = 0 ] \
            || { echo "subscription_smoke_failed: a PASS needs both CLI exits to be 0 (auth status: $auth_exit, request: $cli_exit)" >&2; exit 1; }
          exit "$status"

      - name: Build the executor, the preflight probe and the live entrypoint
        run: |
          npm run relay:executor:build
          npm run relay:julius:preflight:build
          npm run relay:julius:build

      - name: Build the pinned sandbox and executor images
        id: images
        # Shared with the `first-live-topology` job in julius-real-infra.yml, so
        # the Docker regression builds exactly what the mission builds.
        run: ./.github/julius-live-images.sh

      - name: Create the ephemeral scoped credentials
        id: identity
        # No signing key is created here: the executor mints its own inside its
        # container. Shared with the `first-live-topology` regression job.
        run: ./.github/julius-live-identity.sh

      - name: Provision the disposable mission workspace
        env:
          # The seed tree is the MISSION's; the script is generic.
          JULIUS_MISSION_DIR: ${{ env.MISSION_DIR }}
          # SLICE MODE READS A REVISION, NOT THE WORKING TREE. The checkout is
          # already at this commit, so naming it changes nothing about WHAT is
          # copied — it changes what could go wrong: an unexpectedly dirty
          # runner cannot leak an uncommitted file into a paid mission, and the
          # slice is provably the trusted tree rather than whatever is on disk.
          # Ignored entirely by a mission that ships its own throwaway tree.
          JULIUS_SLICE_REV: ${{ github.sha }}
        run: ./.github/julius-live-workspace.sh

      - name: Start PostgreSQL 16 and the independent executor
        env:
          SANDBOX_IMAGE: ${{ steps.images.outputs.sandbox }}
          EXECUTOR_IMAGE: ${{ steps.images.outputs.executor }}
          EXECUTOR_CREDENTIAL_ROOT: ${{ steps.identity.outputs.root }}
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        # The whole launch — PostgreSQL, the executor with its mounts and
        # environment, the public-key hand-off — lives in one script shared
        # with the `first-live-topology` job in julius-real-infra.yml, which
        # drives this exact executor on real Docker on every relevant PR.
        # The receipt-transport choice is the script's one topology switch
        # (JULIUS_RECEIPT_HOST_ROOT); see the script header.
        run: ./.github/julius-live-executor.sh

      # ------------------------------------------------------------ PREFLIGHT

      - name: 'Preflight: Julius cannot reach the executor signing key'
        # Asserted from the side that must not hold the key; the same script the
        # `first-live-topology` regression runs. See its header for exactly what
        # it does and does not establish.
        run: ./.github/julius-live-key-boundary.sh

      - name: 'Preflight: the receipt transport is private to root and the executor'
        # root:root 0700 on the host, one same-path mount into the executor, no
        # key or ledger on any host path or mount; proven by trying as the runner
        # user, not by reading the launcher. Shared with the regression job.
        run: ./.github/julius-live-receipt-boundary.sh

      - name: 'Preflight: durable store, executor, attestation, sandbox, in-sandbox git'
        env:
          JULIUS_SCOPED_CREDENTIALS: ${{ steps.identity.outputs.scoped }}
        run: npm run relay:julius:preflight

      - name: 'Preflight: install Hermes and bootstrap the ephemeral reviewer profile'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          HERMES_REF: ${{ inputs.hermes_ref }}
        run: ./.github/julius-live-hermes.sh

      - name: 'Preflight: the Mission Contract is valid and bounded'
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          # A claimed lane must be one this mission is granted (see MISSION_LANES
          # in the checker). No lane claimed — a dry run — checks no lane.
          if [ -n "$LANE" ]; then
            node scripts/julius-live-contract-check.mjs "$CONTRACT" --lane "$LANE"
          else
            node scripts/julius-live-contract-check.mjs "$CONTRACT"
          fi

      # THE RESEARCH A CONTRACT GRANTS IS INERT UNTIL SOMEONE OBSERVES IT SERVED.
      #
      # Live Reach refuses a capability no backend has been OBSERVED serving, and
      # that observation arrives through `JULIUS_RESEARCH_OBSERVED_BACKENDS` —
      # which this workflow never set. Every mission granted research therefore
      # ran with every ask refused `capability_unavailable`, and could still
      # complete: a paid qualification proving the opposite of what it was
      # dispatched to show.
      #
      # NOT A LITERAL IN `env:`. An observation is an operator's to make, not a
      # contract's and not this file's; a hard-coded value would be the workflow
      # vouching for a reach nobody looked at. So it is MADE, here, by the
      # entrypoint's `observe-research`: one side-effect-free GET per granted
      # host, through Relay's own bounded fetch and network policy, the same path
      # the retrieval will take. No model provider is contacted, which is why it
      # runs on a dry run too — preflight must prove this for free.
      #
      # FAIL CLOSED. A contract granting research of which nothing was observed
      # exits non-zero and stops the job before the paid step can exist. A
      # contract granting none prints `research_not_granted` and exports nothing.
      #
      # ONE LINE, AND ONLY IF IT IS EXACTLY ONE. `$GITHUB_ENV` is interpreted by
      # the runner for every later step, so nothing but the one anchored,
      # closed-alphabet claim line may reach it: never the log, never a second
      # match, never a line the grammar does not fully describe.
      - name: 'Preflight: observe the research the contract grants, through Relay''s own bounded fetch'
        run: |
          set -uo pipefail
          test -f dist-relay-bridge/julius-live-mission.cjs || { echo 'entrypoint_not_built' >&2; exit 1; }
          set +e
          node dist-relay-bridge/julius-live-mission.cjs observe-research --contract "$CONTRACT" 2>&1 | tee research-observation.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "research_observation_failed: the entrypoint exited $status" >&2
            exit 1
          fi
          claim='^JULIUS_RESEARCH_OBSERVED_BACKENDS=[a-z_]+:[a-z_]+(,[a-z_]+:[a-z_]+)*$'
          count=$(grep -cE "$claim" research-observation.log || true)
          if [ "$count" = '1' ]; then
            grep -E "$claim" research-observation.log >> "$GITHUB_ENV"
            echo 'research observation exported to every later step'
          elif [ "$count" = '0' ] && grep -qx 'research_not_granted: .*' research-observation.log; then
            echo 'no research granted; nothing exported'
          else
            # Exit 0 with research granted always prints one claim. Anything else
            # is an output this step does not understand, and it is not guessed at.
            echo "research_observation_unexported: $count claim line(s)" >&2
            exit 1
          fi

      # EACH PROVIDER ACCEPTS ITS KEY AND SERVES THE PINNED MODEL — CHECKED FOR FREE.
      #
      # Before this, a revoked key, an unfunded account's auth refusal or a model
      # id the provider does not serve surfaced only inside the LIVE step, after
      # the attempt marker was recorded and often after an earlier worker had
      # already been paid. Each provider exposes a model-metadata read that
      # generates nothing and bills nothing, so it is asked here, before the
      # paid queue can admit the run to spend.
      #
      # THE KEY NEVER TOUCHES ARGV OR THE LOG. It reaches curl as a `--config`
      # file on stdin, written by `printf` — a bash builtin, so no process is
      # started with the key in its arguments — and only the HTTP status is
      # kept. No response body is read, stored or printed.
      #
      # BALANCE IS UNKNOWN, AND SAYING SO IS THE CHECK. No provider exposes a
      # spend-free balance query, so this step cannot know whether an account can
      # afford the mission. It says `provider_balance=UNKNOWN` rather than
      # implying "sufficient"; an exhausted balance surfaces as a provider refusal
      # during the run, and the queue report classifies it PROVIDER_BLOCKED.
      #
      # THE CODING AGENT IS NOT AN API-KEY PROVIDER (founder rule, 2026-09-29). It
      # authenticates with the founder's Claude Max subscription via a
      # `claude setup-token` token, so the Anthropic `GET /v1/models` key probe is
      # gone: it could only ever prove an API key, and paid attempt 1 (run
      # 36568129865) died on exactly that key (`credit_unavailable`). In its place,
      # a ZERO-GENERATION subscription check: `auth status --json` with the Agent
      # SDK's own CLI, in an environment holding nothing but PATH, a fresh HOME and
      # the token, asserting a logged-in, first-party subscription path with no
      # API-key source (`scripts/julius-subscription-check.mjs status-verdict`,
      # which only judges the CLI's JSON and starts no process). It writes
      # the anthropic readiness line itself, as SUBSCRIPTION_LOGIN_PRESENT — NOT
      # AUTHENTICATED_MODEL_AVAILABLE, because `auth status` cannot see whether the
      # model is served; the optional subscription smoke above is what proves that.
      # OpenAI and xAI stay API-billed and keep their key probes unchanged.
      - name: 'Preflight: each provider accepts its credential and serves the pinned model, nothing generated'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          : > provider-readiness.log
          # $1 provider  $2 model  $3 url  — the curl config (headers) arrives on stdin.
          #
          # THE VERDICT IS READ FROM THE RECORD, NOT FROM A SHELL VARIABLE. Each
          # probe runs at the end of a pipeline, which bash executes in a
          # subshell, so a `failed=1` set inside it would vanish — and a refused
          # credential would pass this gate. Every probe writes its result line;
          # the step fails unless every line says AUTHENTICATED_MODEL_AVAILABLE.
          probe() {
            local provider=$1 model=$2 url=$3 config code=000 attempt result
            config=$(cat)
            for attempt in 1 2 3; do
              code=$(printf '%s\n' "$config" | curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --config - "$url" 2>/dev/null) || code=000
              case "$code" in 000|429|5??) sleep $((attempt * 5));; *) break;; esac
            done
            case "$code" in
              200) result=AUTHENTICATED_MODEL_AVAILABLE;;
              401|403) result=UNAUTHENTICATED;;
              404) result=MODEL_NOT_FOUND;;
              000|429|5??) result=UNREACHABLE;;
              *) result=UNEXPECTED_STATUS;;
            esac
            echo "provider_readiness provider=$provider model=$model http=$code result=$result" | tee -a provider-readiness.log
          }
          [ -n "$OPENAI_API_KEY" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -n "$XAI_API_KEY" ] || {
            echo 'provider_credentials_missing: a provider credential is not set in the julius-live-validation environment' >&2; exit 1; }
          printf 'header = "Authorization: Bearer %s"\n' "$OPENAI_API_KEY" \
            | probe openai "$OPENAI_PROMPT_ARCHITECT_MODEL" "https://api.openai.com/v1/models/$OPENAI_PROMPT_ARCHITECT_MODEL"
          # The Coding Agent: its SUBSCRIPTION, never an API key. `env-check`
          # refuses a step holding any variable that outranks the token; then the
          # Agent SDK's bundled CLI for this runner (ubuntu x64) runs as a literal
          # command under `env -i`, from an empty directory, so nothing but the
          # allow-listed names can reach it. Its JSON goes to a file the check
          # script judges; stderr is discarded; only closed tokens are printed.
          sub=$(mktemp -d)
          mkdir "$sub/home" "$sub/work"
          if node scripts/julius-subscription-check.mjs env-check --model "$RELAY_HOSTED_CODING_MODEL" | tee -a provider-readiness.log; then
            # Errexit is off for these two, as it is for the roles preflight: under this
            # step's `bash -e`, a non-zero `auth status` or a not-ready verdict would end
            # the step before the reviewer is probed and before the count below. The
            # count is the gate, and it still fails closed.
            set +e
            env -i -C "$sub/work" PATH="$PATH" HOME="$sub/home" CI=1 NO_COLOR=1 TERM=dumb ANTHROPIC_DEFAULT_HAIKU_MODEL="$RELAY_HOSTED_CODING_MODEL" ANTHROPIC_SMALL_FAST_MODEL="$RELAY_HOSTED_CODING_MODEL" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
              "$PWD/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" auth status --json > "$sub/status.json" 2>/dev/null
            node scripts/julius-subscription-check.mjs status-verdict --model "$RELAY_HOSTED_CODING_MODEL" < "$sub/status.json" \
              | tee -a provider-readiness.log
            set -e
          fi
          rm -rf "$sub"
          if [ "$RELAY_HERMES_PROVIDER" = 'xai' ]; then
            printf 'header = "Authorization: Bearer %s"\n' "$XAI_API_KEY" \
              | probe xai "$RELAY_HERMES_MODEL" "https://api.x.ai/v1/models/$RELAY_HERMES_MODEL"
          else
            echo "provider_readiness provider=$RELAY_HERMES_PROVIDER model=$RELAY_HERMES_MODEL http=none result=UNCHECKED" | tee -a provider-readiness.log
          fi
          echo 'provider_balance=UNKNOWN (no provider exposes a spend-free balance query; exhaustion surfaces as PROVIDER_BLOCKED when a provider refuses)' | tee -a provider-readiness.log
          # THREE PROVIDERS READY, AND EACH READY IN ITS OWN SENSE: the two API-billed
          # providers by key + pinned model (AUTHENTICATED_MODEL_AVAILABLE), the
          # Coding Agent by a subscription path with no API key in play
          # (SUBSCRIPTION_LOGIN_PRESENT). Counted per provider, so a subscription
          # line can never stand in for an API one or the other way round.
          probed=$(grep -c '^provider_readiness ' provider-readiness.log || true)
          api_ready=$(grep -cE '^provider_readiness provider=(openai|xai) .* result=AUTHENTICATED_MODEL_AVAILABLE$' provider-readiness.log || true)
          subscription_ready=$(grep -cE '^provider_readiness provider=anthropic .* auth=CLAUDE_SUBSCRIPTION method=(oauth_token|claude\.ai) .* result=SUBSCRIPTION_LOGIN_PRESENT$' provider-readiness.log || true)
          ready=$((api_ready + subscription_ready))
          if [ "$probed" -ne 3 ] || [ "$api_ready" -ne 2 ] || [ "$subscription_ready" -ne 1 ] || [ "$ready" -ne 3 ]; then
            echo 'provider_not_ready: an API provider refused its credential, does not serve the pinned model, or could not be reached, or the Coding Agent has no subscription path free of an API key; nothing was spent' >&2
            exit 1
          fi

      - name: 'Preflight: all three roles resolve to the expected models, nothing dispatched'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The Coding Agent runs on the founder's Claude subscription, never on an
          # Anthropic API key: the key is deliberately NOT passed to this step.
          JULIUS_CLAUDE_AUTH: CLAUDE_SUBSCRIPTION
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JULIUS_SCOPED_CREDENTIALS: ${{ steps.identity.outputs.scoped }}
          RELAY_HERMES_EXECUTABLE: /tmp/julius-hermes-bin/hermes
        run: |
          set -uo pipefail
          # No `--confirm-live`. The entrypoint resolves every role, reports
          # SET/MISSING for every credential, and STOPS with exit 5 before it
          # constructs a provider client or opens a connection. Any other exit
          # code means the rig is not ready, and 5 is the only one that proves
          # it is.
          set +e
          npm run --silent relay:julius:mission -- run --contract "$CONTRACT" | tee preflight-roles.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 5 ]; then
            echo "preflight_not_ready: the entrypoint exited $status, expected 5 (ready, awaiting --confirm-live)" >&2
            exit 1
          fi
          # Exit 5 above already proves all three roles RESOLVED — adapters were
          # constructed. These greps pin WHICH models were configured. The model a
          # provider actually serves is a different fact, observed during the run
          # and recorded as `actualModel` / `servedModel`; nothing here can know it.
          grep -q 'architect=gpt-5.6-sol' preflight-roles.log || { echo 'architect_model_unexpected' >&2; exit 1; }
          grep -q 'coder=claude-opus-5-5' preflight-roles.log || { echo 'coding_model_unexpected' >&2; exit 1; }
          grep -q 'reviewer=xai/grok-build-0.1' preflight-roles.log || { echo 'reviewer_model_unexpected' >&2; exit 1; }
          # THE LIVE LEDGER IS BOUND, OR THE PAID RUN DOES NOT START. Without it every
          # dispatch is allocated a flat estimate (paid run 34739303313: a $0.30
          # coder stopped after two turns). The entrypoint prints the answer from
          # the store it will actually use; nothing but BOUND is accepted.
          grep -qx '  live_ledger: BOUND' preflight-roles.log || { echo 'live_ledger_unbound: allocation would fall back to a flat estimate' >&2; exit 1; }
          for name in OPENAI_API_KEY CLAUDE_CODE_OAUTH_TOKEN DATABASE_URL JULIUS_EXECUTOR_ENDPOINT JULIUS_SCOPED_CREDENTIALS EXECUTOR_KEY_ID JULIUS_PUBLIC_KEY_PATH JULIUS_CALLER_ID; do
            grep -q "^  $name: SET$" preflight-roles.log || { echo "preflight_variable_not_set:$name" >&2; exit 1; }
          done
          # HOW EACH ROLE IS PAID FOR, AS THE ENTRYPOINT RESOLVED IT, OR NO PAID RUN.
          # Paid attempt 1 (run 36568129865) ran the Coding Agent on an API key and
          # died on `credit_unavailable`. The founder's rule: the Coding Agent is
          # the Claude subscription, the architect and reviewer are API-billed.
          grep -qx '  ANTHROPIC_API_KEY: MISSING' preflight-roles.log || { echo 'coder_api_key_present: the entrypoint saw an Anthropic API key' >&2; exit 1; }
          grep -qE '^  CLAUDE AUTH: SUBSCRIPTION provider=ANTHROPIC execution=CLAUDE_AGENT_SDK plan=[a-z]+ api_key_used=false api_cost_applicable=false$' preflight-roles.log \
            || { echo 'coder_auth_not_subscription: the Coding Agent did not resolve to the Claude subscription' >&2; exit 1; }
          grep -qx '  claude auth source: subscription_oauth_token' preflight-roles.log \
            || { echo 'coder_auth_source_unexpected: the Coding Agent is not on the setup-token subscription token' >&2; exit 1; }
          grep -qx '  billing paths: architect=API_BILLED coder=SUBSCRIPTION reviewer=API_BILLED' preflight-roles.log \
            || { echo 'billing_paths_unexpected: expected architect=API_BILLED coder=SUBSCRIPTION reviewer=API_BILLED' >&2; exit 1; }
          echo 'PREFLIGHT OK: three roles resolved, every variable present, coder on the Claude subscription, no provider contacted.'

      - name: 'Preflight complete — stopping here (no confirm_live given)'
        if: inputs.confirm_live != 'RUN LIVE MISSION'
        run: |
          echo 'Preflight passed and NOTHING was dispatched.'
          echo 'To run the paid mission, dispatch this workflow again with confirm_live = "RUN LIVE MISSION".'

      # ----------------------------------------------------------------- LIVE

      # THE LAST FREE STEP. Everything above proved the rig without spending
      # anything billable (a paid run's subscription smoke is one tiny request on
      # the coder's subscription, never API credit); the entrypoint below can
      # contact a provider on its first tick. The attempt is recorded HERE, in
      # between, so a run that dies mid-mission still leaves the durable fact that
      # a paid run was entered. No paid step runs unless that smoke PASSED in this
      # job: each names `steps.subscription_smoke.outcome == 'success'`.
      #
      # ORDERING IS THE SEMANTIC. The marker means "authorized and about to
      # start", not "a provider was billed" — a claim this job could never
      # prove. Writing it after the mission would lose exactly the case that
      # matters: attempt #1, which entered LIVE, failed, and left nothing
      # behind for the next dispatch to find.
      - name: 'Record that a paid mission was attempted (before any provider can be reached)'
        id: attempt_marker
        if: success() && inputs.confirm_live == 'RUN LIVE MISSION' && steps.subscription_smoke.outcome == 'success'
        env:
          MARKER_DIR: ${{ steps.inputs_gate.outputs.marker_namespace }}-attempted
        run: |
          set -euo pipefail
          # Safe provenance only. The contract digest identifies WHAT was
          # authorized without reproducing any of its text.
          mkdir -p "$MARKER_DIR"
          # On its own line, so `set -e` sees a failed digest. Inside an `echo`
          # argument a failed substitution is invisible and the marker would
          # record an empty `contract_sha256=` — its one statement of WHAT was
          # authorized — while the step still reported success.
          digest=$(sha256sum "$CONTRACT" | cut -d' ' -f1)
          [ -n "$digest" ] || { echo 'contract_digest_unavailable' >&2; exit 1; }
          {
            echo "attempted_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF:-unknown}"
            echo "contract_sha256=$digest"
          } > "$MARKER_DIR/marker.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && inputs.confirm_live == 'RUN LIVE MISSION' && steps.subscription_smoke.outcome == 'success'
        with:
          name: ${{ steps.inputs_gate.outputs.marker_namespace }}-attempted
          path: ${{ steps.inputs_gate.outputs.marker_namespace }}-attempted
          retention-days: 90
          # v4 defaults to `warn`: an empty directory would UPLOAD NOTHING and
          # still report success, and the next step is the one that spends.
          # `error` makes "a marker exists before any provider can be reached"
          # a property of this step rather than a consequence of the previous
          # step's `set -e`.
          if-no-files-found: error

      # `success()` IS EXPLICIT, NOT NEW. GitHub already applies a default
      # `success()` to a step whose `if:` names no status function, and this
      # workflow's own history proves it: in runs 33625851653 and 33635375764
      # the preflight failed and both custom-`if:` steps below it were SKIPPED,
      # while the `always()` steps ran. Writing the check out keeps the
      # fail-closed property visible at the one place it must never be lost —
      # an `always()` or `!cancelled()` added to a paid step would read as an
      # obvious mistake instead of a subtle one — and the contract test pins it.
      - name: 'LIVE: run the first real Julius mission'
        id: live_mission
        if: success() && inputs.confirm_live == 'RUN LIVE MISSION' && steps.subscription_smoke.outcome == 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The Coding Agent on the founder's Claude subscription. No Anthropic API
          # key reaches this step; `hostedChildEnv` admits the token into the
          # Coding Agent's child under CLAUDE_SUBSCRIPTION only.
          JULIUS_CLAUDE_AUTH: CLAUDE_SUBSCRIPTION
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JULIUS_SCOPED_CREDENTIALS: ${{ steps.identity.outputs.scoped }}
          # The reviewer is spawned through a wrapper that sets HOME to the
          # ephemeral profile for ITSELF ALONE. Setting HOME on this step
          # instead would hand the same credential-bearing directory to the
          # live Claude coding agent, which is a child of this same process
          # and holds Read/Glob/Grep.
          RELAY_HERMES_EXECUTABLE: /tmp/julius-hermes-bin/hermes
          MAX_TICKS: ${{ inputs.max_ticks }}
          JULIUS_JOB_STARTED_AT: ${{ steps.inputs_gate.outputs.job_started_at }}
        run: |
          set -uo pipefail
          # The bundle was built in an earlier step and is invoked directly,
          # so this step starts no build and depends on no package manager.
          test -f dist-relay-bridge/julius-live-mission.cjs || { echo 'entrypoint_not_built' >&2; exit 1; }
          set +e
          node dist-relay-bridge/julius-live-mission.cjs \
            run --contract "$CONTRACT" --confirm-live --max-ticks "$MAX_TICKS" | tee live-mission.log
          status=${PIPESTATUS[0]}
          set -e
          echo "julius_exit=$status"
          exit "$status"

      # ------------------------------------------------------------- EVIDENCE

      # COMPLETED MEANS LIVE SUCCEEDED, named by id. LIVE can now be SKIPPED while
      # success() still holds (its own condition also needs the smoke's success), and a
      # skipped LIVE must never leave a durable "a paid mission completed" behind: the
      # inputs gate counts that marker.
      - name: Record that a paid mission completed
        if: success() && inputs.confirm_live == 'RUN LIVE MISSION' && steps.live_mission.outcome == 'success'
        env:
          MARKER_DIR: ${{ steps.inputs_gate.outputs.marker_namespace }}-completed
        run: |
          set -euo pipefail
          # Safe identifiers only: this marker exists to be COUNTED by a later
          # dispatch, so it carries nothing but provenance.
          mkdir -p "$MARKER_DIR"
          {
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF:-unknown}"
          } > "$MARKER_DIR/marker.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && inputs.confirm_live == 'RUN LIVE MISSION' && steps.live_mission.outcome == 'success'
        with:
          name: ${{ steps.inputs_gate.outputs.marker_namespace }}-completed
          path: ${{ steps.inputs_gate.outputs.marker_namespace }}-completed
          retention-days: 90
          # Nothing spends after this step; its reason is the NEXT dispatch.
          # An empty directory uploads no artifact and still reports success,
          # so `count_markers julius-first-live-completed` would find none and
          # a later run would be told no paid mission has ever completed.
          if-no-files-found: error

      - name: Collect the redacted validation evidence
        if: always()
        env:
          PGPASSWORD: ${{ steps.identity.outputs.database_password }}
        run: |
          set -uo pipefail
          mkdir -p julius-live-evidence
          # WHICH REVIEWER ACTUALLY RAN, and under which two deadlines. Written
          # by the Hermes bootstrap, which prints the same six lines to the
          # public step log; run 34311556047 had none of them in its bundle.
          cp /tmp/julius-hermes-bootstrap.evidence.txt \
            julius-live-evidence/hermes-bootstrap.evidence.txt 2>/dev/null || true
          # The executor answers every refused request with a safe code and,
          # because dry run #2 left nothing to read, now writes one
          # executor-local diagnostic line per refusal to its own stderr:
          # operation, safe result, error class, status — never a message. Its
          # raw container log is captured to a 0600 file, reduced to that
          # allowlist, and the raw file is deleted before the upload step
          # exists. A raw executor log is never uploaded.
          umask 077
          raw_executor_log=$(mktemp)
          docker logs julius-executor > "$raw_executor_log" 2>&1 || true
          # Kept lines must match the executor's exact grammar, not merely a
          # character set: a credential-shaped tail on an otherwise valid line
          # would survive a charset filter.
          grep -E '^executor_(ready:[0-9]{1,5}|diagnostic operation=[a-z]+ result=[A-Za-z0-9_.:-]{1,120} class=[A-Za-z0-9_]{1,32} status=[0-9]{3})$' "$raw_executor_log" \
            > julius-live-evidence/executor-diagnostics.txt || true
          rm -f "$raw_executor_log"
          umask 022
          # The raw logs are NEVER copied. They are rebuilt line by line from an
          # allowlist of known shapes, so a future entrypoint change cannot put
          # something unexamined into an artifact that outlives this job.
          for log in preflight-roles.log live-mission.log; do
            if [ -f "$log" ]; then
              node scripts/julius-live-evidence.mjs "$log" > "julius-live-evidence/${log%.log}.evidence.txt" || true
            fi
          done
          # WHAT RESEARCH WAS OBSERVED BEFORE THE RUN, by the same allowlist rule:
          # only the exact grammar `observe-research` prints — five closed fields
          # per probe, the summary, the claim, and its two fixed refusals — so a
          # bundle can say why a research ask was or was not servable.
          grep -E '^(research_observation source=[a-z]+ capability=[a-z_]+ host=[a-z0-9*.-]+ backend=[a-z_]+ result=(observed|unreachable|throttled|unauthenticated|unconfigured)|research_observation_summary observed=[0-9]+ of=[0-9]+|JULIUS_RESEARCH_OBSERVED_BACKENDS=[a-z_]+:[a-z_]+(,[a-z_]+:[a-z_]+)*|research_not_granted: the contract has no research clause, so there is nothing to observe\.|research_unobservable: no backend was observed serving any of the [0-9]+ research probe\(s\) the contract grants; refusing to dispatch a mission whose research would all be refused\.)$' research-observation.log \
            > julius-live-evidence/research-observation.txt 2>/dev/null || true
          # WHETHER EACH PROVIDER WAS READY, by the same allowlist rule: only the
          # exact lines the readiness step prints — provider, model, status, result
          # — and the balance disclaimer. Never a header, never a body.
          # The Coding Agent's subscription line has closed fields of its own.
          grep -E '^(provider_readiness provider=[a-z]+ model=[A-Za-z0-9._:/-]+ http=([0-9]{3}|none) result=(AUTHENTICATED_MODEL_AVAILABLE|UNAUTHENTICATED|MODEL_NOT_FOUND|UNREACHABLE|UNEXPECTED_STATUS|UNCHECKED)|provider_readiness provider=anthropic model=[A-Za-z0-9._-]+ http=none auth=CLAUDE_SUBSCRIPTION (method=(oauth_token|claude\.ai) plan=(max|pro|team|enterprise|absent)|reason=[A-Z_+]+) result=(SUBSCRIPTION_LOGIN_PRESENT|SUBSCRIPTION_NOT_READY)|provider_balance=UNKNOWN .*)$' provider-readiness.log \
            > julius-live-evidence/provider-readiness.txt 2>/dev/null || true
          # The subscription smoke (on its own, or before a paid run), when it ran: closed tokens only.
          if [ -f subscription-smoke.log ]; then
            grep -E '^(subscription_smoke_auth provider=anthropic model=[A-Za-z0-9._-]+ http=none auth=CLAUDE_SUBSCRIPTION (method=(oauth_token|claude\.ai) plan=(max|pro|team|enterprise|absent)|reason=[A-Z_+]+) result=(SUBSCRIPTION_LOGIN_PRESENT|SUBSCRIPTION_NOT_READY)|subscription_smoke provider=anthropic model=[A-Za-z0-9._-]+ auth=CLAUDE_SUBSCRIPTION method=(oauth_token|claude\.ai|none) reply=(OK|UNEXPECTED|ERROR|UNREADABLE|NO_SUBSCRIPTION_STATUS) result=(PASS|FAIL)|subscription_smoke_(auth|cli)_exit=[0-9]{1,3}|subscription_smoke_served provider=anthropic requested=[A-Za-z0-9._-]{1,64} served=(none|[A-Za-z0-9._-]{1,64}(,[A-Za-z0-9._-]{1,64}){0,7}) match=(EXACT|DATED_BUILD|MISMATCH|NONE)|subscription_smoke_reason provider=anthropic model=[A-Za-z0-9._-]{1,64} reason=(MODEL_NOT_ENTITLED_OR_NOT_FOUND|AUTH|USAGE_LIMIT|RATE_LIMITED|OVERLOADED|MAX_TURNS|UNEXPECTED_REPLY|UNREADABLE|SERVED_MODEL_MISMATCH|SERVED_MODEL_UNATTESTED|EXIT_UNREPORTED|AUTH_EXIT_NONZERO|CLI_EXIT_NONZERO|OTHER) http=([1-5][0-9]{2}|none) subtype=([a-z_]{1,40}|none))$' subscription-smoke.log \
              > julius-live-evidence/subscription-smoke.txt 2>/dev/null || true
          fi

          # Only safe columns, from one script the `first-live-topology` job also
          # runs against a freshly migrated database — dry runs #1 and #2 uploaded
          # `unavailable` for two tables because the inline queries named a
          # column and a table the migrations never created.
          # A job that ended before the identity step (a refused smoke, an early gate)
          # never generated a database password, so no database was started and there
          # is nothing to dump. It says so, instead of failing this always-run step on
          # the dump's own PGPASSWORD guard and reading as a second failure (run
          # 36685079176). Once the identity exists, the dump runs as before.
          if [ -n "${PGPASSWORD:-}" ]; then
            ./.github/julius-live-evidence-dump.sh julius-live-evidence
          else
            echo 'dump_skipped: no database identity was generated in this job, so no database was started' > julius-live-evidence/dump-skipped.txt
          fi

          # The mission's own diff is the point of the exercise; it contains
          # only what a live coding agent wrote into a throwaway repository.
          git -c safe.directory="$JULIUS_WORKSPACE" -C "$JULIUS_WORKSPACE" --no-pager diff \
            > julius-live-evidence/workspace.diff 2>/dev/null || true
          git -c safe.directory="$JULIUS_WORKSPACE" -C "$JULIUS_WORKSPACE" status --porcelain=v1 \
            > julius-live-evidence/workspace-status.txt 2>/dev/null || true

          # Receipt IDENTIFIERS and digests only — never a receipt body, which
          # carries command text and signatures.
          # The receipt root the executor was actually given (the host transport since PR #214);
          # the entries are sha256 scope names, safe to publish.
          docker exec julius-executor sh -c 'ls -1 "$EXECUTOR_RECEIPT_ROOT" 2>/dev/null | head -n 200' \
            > julius-live-evidence/receipt-ids.txt 2>/dev/null || true

          # WHAT THIS MISSION DID NOT DO, PROVEN ANYWAY.
          #
          # A healthy mission never crashes, so it never exercises restart
          # recovery, and the Beta Gate refuses to infer a capability from the
          # fact that its source is in the tree. Requiring a paid run to break
          # itself to score the row would be asking the product to lie in the
          # other direction. So the drill runs here, after the mission, and the
          # bundle carries its attestation beside the mission's own rows: the
          # gate then reports RESTART / RECOVERY as CAPABILITY PROVEN — NOT
          # EXERCISED THIS MISSION, which is the true sentence.
          #
          # IN A DATABASE OF ITS OWN, and after the dump has already run, so the
          # drill's mission cannot appear in this mission's evidence by any
          # route. Nothing here may fail the job: the mission has already run
          # and its evidence is already collected, and a missing capability
          # proof is a row the gate reports as unproven, not a reason to lose
          # the artifact. No provider credential is involved — the drill's three
          # role adapters are fakes and only the recovery path is production.
          # `set -u` is in force and DATABASE_URL is exported by the executor
          # launch, so a mission that never got that far would ABORT this step
          # on the expansion below and lose the evidence collected above it.
          # Guarded, not assumed.
          if [ -n "${DATABASE_URL:-}" ]; then
            # ONE DATABASE PER DRILL, and each drill refuses a database that
            # already holds its run, so none can read another's rows as its own.
            for drill in recovery-drill failure-recovery-drill repair-loop-drill; do
              db="julius_${drill//-/_}"
              if docker exec -e PGPASSWORD julius-postgres createdb -U "$PGUSER" "$db" 2>/dev/null; then
                DATABASE_URL="${DATABASE_URL%/*}/$db" \
                  npm run "julius:$drill" --silent -- --out /tmp/julius-capability-proofs > /dev/null 2>&1 || true
              fi
            done
            # The ledger is merged by the drills, so one copy carries all three.
            cp /tmp/julius-capability-proofs/capability-proofs.tsv \
               /tmp/julius-capability-proofs/*.transcript.txt \
               julius-live-evidence/ 2>/dev/null || true
            rm -rf /tmp/julius-capability-proofs
          fi

      - name: Refuse to publish evidence that contains credential material
        if: always()
        env:
          EXECUTOR_ROOT: ${{ steps.identity.outputs.root }}
          SCOPED: ${{ steps.identity.outputs.scoped }}
          DB_PASSWORD: ${{ steps.identity.outputs.database_password }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Kept although no step passes it any more: scanning for a secret this
          # job might still hold costs nothing, and dropping it would be a gap.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Coding Agent's subscription token is a credential like any other.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -uo pipefail
          if [ ! -d julius-live-evidence ]; then exit 0; fi
          umask 077
          needles=$(mktemp)
          clean=0
          # FAIL CLOSED ON EVERY EXIT PATH: the needles always go, and the bundle goes too unless the very last
          # statement below ran. GitHub's `bash -e` can end this step at any failing command, and the upload runs
          # `if: always()`.
          trap 'rm -f "$needles"; [ "$clean" = 1 ] || rm -rf julius-live-evidence' EXIT
          refuse() { echo "$1: refusing to upload" >&2; exit 1; }

          # LAYER TWO's needles — the exact values this job actually holds. A shape rule cannot know what a
          # 43-character base64url scoped credential looks like, so the values themselves are matched literally.
          for value in "$EXECUTOR_ROOT" "$DB_PASSWORD" "$OPENAI_API_KEY" "$ANTHROPIC_API_KEY" "$CLAUDE_CODE_OAUTH_TOKEN" "$XAI_API_KEY"; do
            if [ -n "$value" ]; then printf '%s\n' "$value" >> "$needles"; fi
          done
          # Every derived scoped credential, pulled out of the JSON map. awk re-terminates every record: without it
          # the map's final value arrives without a trailing newline, and anything appended later would fuse with it.
          printf '%s' "$SCOPED" | tr ',' '\n' | sed -n 's/.*:"\([A-Za-z0-9_-]\{20,\}\)".*/\1/p' | awk '{ print }' >> "$needles" || true

          # WHICH FILES EACH LAYER MATCHES, by name only (nothing that matched is printed). grep: 0 = hit, 1 = none,
          # 2+ = an error, and an error is NEVER read as clean.
          # LAYER ONE — shapes. Catches a credential this job never minted. `sk-ant-oat01-…` (a setup-token
          # subscription token) is covered by the first alternative; an assignment of the token variable is named too.
          shape_hits=$(grep -rlE '(sk-(ant-|proj-)?[A-Za-z0-9_-]{16,}|xai-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{16,}|BEGIN [A-Z ]*PRIVATE KEY|Authorization:[[:space:]]*([A-Za-z]+[[:space:]]+)?[A-Za-z0-9._-]{16,}|CLAUDE_CODE_OAUTH_TOKEN[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._-]{8,})' julius-live-evidence) && rc=0 || rc=$?
          [ "$rc" -le 1 ] || refuse evidence_scan_error
          exact_hits=''
          if [ -s "$needles" ]; then
            exact_hits=$(grep -rlF -f "$needles" julius-live-evidence) && rc=0 || rc=$?
            [ "$rc" -le 1 ] || refuse evidence_scan_error
          fi

          # A HIT OUTSIDE A WORK-ARTIFACT BODY REFUSES THE WHOLE BUNDLE, as it always has. Which layer is said;
          # which value matched is deliberately not.
          body='^julius-live-evidence/artifacts/[0-9a-f]{64}[.]body$'
          outside=$(printf '%s\n' "$shape_hits" | sed '/^$/d' | grep -vE "$body") && rc=0 || rc=$?
          [ "$rc" -le 1 ] || refuse evidence_scan_error
          [ -z "$outside" ] || refuse evidence_contains_credential_shaped_material
          outside=$(printf '%s\n' "$exact_hits" | sed '/^$/d' | grep -vE "$body") && rc=0 || rc=$?
          [ "$rc" -le 1 ] || refuse evidence_scan_error
          [ -z "$outside" ] || refuse evidence_contains_a_live_credential

          # A HIT INSIDE A BODY DROPS THAT BODY ONLY (founder decision A, 2026-10-03), and records it: the artifact id,
          # body, content hash and size from BODIES.tsv, the layer, and DROPPED_BY_SCAN — never the matched text. A body
          # that BODIES.tsv does not name as COPIED (or no BODIES.tsv at all) is not this pipeline's: the bundle is refused.
          record=julius-live-evidence/artifacts/DROPPED_BY_SCAN.tsv
          for layer in shape exact; do
            if [ "$layer" = shape ]; then hits=$shape_hits; else hits=$exact_hits; fi
            for file in $(printf '%s\n' "$hits" | sed '/^$/d' | sort -u); do
              [ -f "$file" ] || continue
              [ -f julius-live-evidence/artifacts/BODIES.tsv ] || refuse evidence_body_unrecorded
              row=$(awk -F'\t' -v b="artifacts/${file##*/}" '$2 == b && $5 == "COPIED" { print $1 "\t" $2 "\t" $3 "\t" $4; exit }' julius-live-evidence/artifacts/BODIES.tsv)
              [ -n "$row" ] || refuse evidence_body_unrecorded
              [ -f "$record" ] || printf 'artifact_id\tbody\tcontent_hash\tbyte_size\tlayer\tmarker\n' > "$record"
              printf '%s\t%s\tDROPPED_BY_SCAN\n' "$row" "$layer" >> "$record"
              rm -f "$file"
            done
          done

          # BOTH LAYERS AGAIN over what is left: the bundle must now be clean (grep exits 1), or none of it is uploaded.
          # A hit (0) and an error (2+) both refuse.
          grep -rqE '(sk-(ant-|proj-)?[A-Za-z0-9_-]{16,}|xai-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{16,}|BEGIN [A-Z ]*PRIVATE KEY|Authorization:[[:space:]]*([A-Za-z]+[[:space:]]+)?[A-Za-z0-9._-]{16,}|CLAUDE_CODE_OAUTH_TOKEN[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._-]{8,})' julius-live-evidence && rc=0 || rc=$?
          [ "$rc" -eq 1 ] || refuse evidence_scan_not_clean_after_drop
          if [ -s "$needles" ]; then
            grep -rqF -f "$needles" julius-live-evidence && rc=0 || rc=$?
            [ "$rc" -eq 1 ] || refuse evidence_scan_not_clean_after_drop
          fi
          dropped=0
          if [ -f "$record" ]; then dropped=$(( $(wc -l < "$record") - 1 )); fi
          echo "evidence scan clean (shapes and exact values); work-artifact bodies dropped by the scan: $dropped"
          clean=1

      # THE BUNDLE RESOLVES ITSELF (decision A). The resolver the dump copied in verifies every body against both
      # hashes from the bundle alone. A body that does not verify is evidence of a fault: this step FAILS VISIBLY and
      # names it, and the bundle is still uploaded (it is the evidence of that fault). Nothing is written into the
      # bundle after the scan: the report goes to the job summary.
      - name: The evidence bundle resolves every artifact it names (strict)
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f julius-live-evidence/resolve-artifacts.mjs ]; then echo 'no resolver in the bundle (no dump ran)'; exit 0; fi
          set +e
          node julius-live-evidence/resolve-artifacts.mjs --strict | tee "$RUNNER_TEMP/resolve-artifacts.txt"
          code=${PIPESTATUS[0]}
          set -e
          { echo '### Evidence bundle resolution (strict)'; echo '```'; cat "$RUNNER_TEMP/resolve-artifacts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then echo "::error title=Evidence bundle does not resolve::resolve-artifacts --strict exited $code (see the job summary)"; fi
          exit "$code"

      # THE PAID-RUN ARCHIVE'S EXPORT. This job's PostgreSQL is disposable and
      # dies with the runner whatever step runs next, so this artifact is the
      # only copy of the run's state. It is the export the local importer
      # (`scripts/julius-paid-run-archive.mjs import --run <id>`) reads into the
      # durable `julius-postgres` archive; 90 days, not 14, so an import is not
      # a race.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: evidence_upload
        if: always()
        with:
          name: julius-live-evidence
          path: julius-live-evidence
          if-no-files-found: ignore
          retention-days: 90

      # PRESERVED, OR SAID NOT TO BE. An upload of nothing still succeeds
      # (`if-no-files-found: ignore`, and the credential refusal above deletes
      # the directory rather than upload it), so success of the step alone is
      # not preservation. The line names which it was, in the log and the job
      # summary, before teardown.
      - name: "Archive export: say whether this run's state was preserved"
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
        run: |
          set -uo pipefail
          if [ "$UPLOAD_OUTCOME" = 'success' ] && [ -f julius-live-evidence/tasks.tsv ]; then
            echo "PAID_RUN_ARCHIVE_EXPORTED artifact=julius-live-evidence retention_days=90 workflow_run_id=$GITHUB_RUN_ID workflow_run_attempt=$GITHUB_RUN_ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            evidence=absent
            [ -d julius-live-evidence ] && evidence=present_without_tasks
            echo "PAID_RUN_ARCHIVE_FAILED upload_outcome=${UPLOAD_OUTCOME:-unknown} evidence=$evidence workflow_run_id=$GITHUB_RUN_ID workflow_run_attempt=$GITHUB_RUN_ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=PAID_RUN_ARCHIVE_FAILED::this run's state was NOT preserved; the disposable database is destroyed with the job"
          fi

      # -------------------------------------------------------------- CLEANUP

      - name: Destroy everything this job created
        if: always()
        run: |
          set -uo pipefail
          docker ps -aq --filter 'label=julius.sandbox' | xargs -r docker rm -f 2>/dev/null || true
          docker rm -f julius-executor julius-postgres 2>/dev/null || true
          # The reviewer profile holds the xAI credential; it never outlives
          # the job.
          rm -rf /tmp/julius-hermes-home /tmp/julius-hermes-bin 2>/dev/null || true
          rm -rf /opt/hermes-venv /opt/hermes-src 2>/dev/null || true
          # The signing key and the ledger lived inside the executor container's
          # own layer, so removing the container removed them. The receipt
          # transport lived on the host, root-owned: it is removed here, after
          # every container that could still write into it is gone.
          rm -f /tmp/julius-public.pem 2>/dev/null || true
          sudo rm -rf /tmp/julius-executor 2>/dev/null || true
          sudo umount /tmp/julius-workspace/tenant/ws 2>/dev/null || true
          sudo rm -rf /tmp/julius-workspace 2>/dev/null || true
          echo 'cleanup complete'
