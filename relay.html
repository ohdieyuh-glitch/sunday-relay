<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sunday Relay</title>
    <!--
      COMPATIBILITY ONLY — NOT A SECOND APPLICATION ENTRY.

      Sunday Relay's canonical document is `index.html`, so the application
      loads from the root URL `/`. This file exists solely because `/relay.html`
      was the entry before that, and a link or bookmark to it must not 404.

      It deliberately contains NO application markup and NO module script. A
      second copy of the real document would be a copy that drifts: one entry
      would gain a meta tag, a viewport rule or a favicon and the other would
      not, and whichever one a customer opened would be the stale one. There is
      exactly one Relay document, and this redirects to it.
    -->
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="canonical" href="/" />
    <script>
      // Replace rather than assign, so the redirect does not trap the Back
      // button on a page that only ever forwards.
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Sunday Relay has moved to <a href="/">/</a>.</p>
  </body>
</html>
